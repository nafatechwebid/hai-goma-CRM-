<script>
/* Bunyi bel keras saat chat/order masuk (selama CRM terbuka) */
(function(){
  var audio=null, unlocked=false;
  function on(){ try{ return localStorage.getItem("goma_bell")!=="0"; }catch(_){ return true; } }
  function get(){ if(!audio){ audio=new Audio("/bell.wav"); audio.preload="auto"; audio.volume=1; } return audio; }
  function unlock(){
    if(unlocked) return; unlocked=true;
    try{ var a=get(); a.muted=true; var p=a.play(); if(p&&p.then) p.then(function(){a.pause();a.currentTime=0;a.muted=false;}).catch(function(){a.muted=false;unlocked=false;}); else {a.pause();a.muted=false;} }catch(_){ unlocked=false; }
  }
  ["click","touchstart","keydown"].forEach(function(ev){ document.addEventListener(ev,unlock,{once:false,passive:true}); });
  var lastRing=0;
  window.gomaRing=function(force){
    if(!force && !on()) return;
    var now=Date.now(); if(!force && now-lastRing<2500) return; lastRing=now;
    try{ var a=get(); a.muted=false; a.volume=1; a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(_){}
    try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(_){}
  };
  window.gomaBellOn=on;
  window.gomaBellToggle=function(){
    try{ localStorage.setItem("goma_bell", on()?"0":"1"); }catch(_){}
    if(typeof window.gomaPushRefresh==="function") window.gomaPushRefresh();
  };

  /* Bunyi bila ada pesan masuk baru saat sinkronisasi */
  var orig=window.syncWhatsAppInbox;
  if(typeof orig==="function"){
    window.syncWhatsAppInbox=async function(){
      var before=new Map((db.inbox||[]).filter(function(x){return x.waConversation||x.id!=null}).map(function(x){return [String(x.id),Number(x.last_message_at||x.timestamp||x.last_timestamp||0)]}));
      var had=before.size>0;
      var r=await orig.apply(this,arguments);
      try{
        if(had){
          var fresh=(db.inbox||[]).some(function(x){
            if(!x.unread) return false;
            var ts=Number(x.last_message_at||x.timestamp||x.last_timestamp||0);
            var b=before.get(String(x.id));
            return b===undefined ? ts>0 : ts>b;
          });
          if(fresh) window.gomaRing();
        }
      }catch(_){}
      return r;
    };
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message",function(e){
      if(e.data && e.data.type==="ring") window.gomaRing();
    });
  }
})();
</script>
<script>
/* Balasan Cepat dengan gambar */
(function(){
  var E=function(v){return (typeof escapeHtml==="function")?escapeHtml(v==null?"":String(v)):String(v||"")};
  var newImg=null;

  function compress(file){
    return new Promise(function(res,rej){
      var img=new Image(), u=URL.createObjectURL(file);
      img.onload=function(){
        var M=1280,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));
        w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.82));
      };
      img.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("Gambar tidak bisa dibaca")); };
      img.src=u;
    });
  }
  function saveSafe(){
    try{ save(); return true; }
    catch(e){ alert("Penyimpanan browser penuh. Hapus gambar balasan cepat yang tidak dipakai, atau pakai gambar yang lebih kecil."); return false; }
  }
  function imgName(sc){ return "balasan-"+String(sc||"gambar").replace(/[^A-Za-z0-9]+/g,"")+".jpg"; }

  /* ---- Pengaturan ---- */
  window.qrPickNew=async function(inp){
    var f=inp.files&&inp.files[0]; inp.value="";
    var info=document.getElementById("qrImgInfo"); if(!f) return;
    try{
      newImg=await compress(f);
      if(info) info.innerHTML='<img src="'+newImg+'" style="height:64px;border-radius:8px;vertical-align:middle;margin-right:8px"> Gambar siap ('+Math.round(newImg.length*0.75/1024)+' KB) <button type="button" class="btn" onclick="qrClearNew()">Hapus</button>';
    }catch(e){ alert(e.message||e); }
  };
  window.qrClearNew=function(){ newImg=null; var i=document.getElementById("qrImgInfo"); if(i) i.innerHTML=""; };

  window.addQuickReply=function(){
    var sc=document.getElementById("qrShortcut").value.trim(),
        title=document.getElementById("qrTitle").value.trim(),
        text=document.getElementById("qrText").value.trim();
    if(!sc||(!text&&!newImg)) return alert("Shortcut dan teks (atau gambar) wajib diisi.");
    db.settings.quickReplies=db.settings.quickReplies||[];
    var q={shortcut:sc,title:title||sc,text:text};
    if(newImg) q.image={data:newImg,name:imgName(sc)};
    db.settings.quickReplies.push(q);
    if(!saveSafe()){ db.settings.quickReplies.pop(); return; }
    newImg=null; render_settings();
  };

  window.qrRowImage=function(i){
    var inp=document.getElementById("qrRowFile"); if(!inp) return;
    inp.dataset.i=String(i); inp.click();
  };
  window.qrRowPicked=async function(inp){
    var f=inp.files&&inp.files[0], i=Number(inp.dataset.i); inp.value=""; if(!f) return;
    var q=db.settings.quickReplies[i]; if(!q) return;
    try{
      var old=q.image;
      q.image={data:await compress(f),name:imgName(q.shortcut)};
      if(!saveSafe()){ q.image=old; return; }
      render_settings();
    }catch(e){ alert(e.message||e); }
  };
  window.qrRowRemoveImage=function(i){
    var q=db.settings.quickReplies[i]; if(!q) return;
    delete q.image; save(); render_settings();
  };

  var prevSettings=window.render_settings;
  window.render_settings=function(){
    var r=prevSettings.apply(this,arguments);
    try{
      var t=document.getElementById("qrText");
      if(t && !document.getElementById("qrImage")){
        var lab=t.closest("label");
        var add=document.createElement("label"); add.className="full";
        add.innerHTML='Gambar (opsional, ikut terkirim bersama teks)<input type="file" id="qrImage" accept="image/*" class="input" onchange="qrPickNew(this)"><span id="qrImgInfo" class="label"></span>';
        if(lab) lab.after(add);
        var hid=document.createElement("input"); hid.type="file"; hid.id="qrRowFile"; hid.accept="image/*"; hid.style.display="none"; hid.setAttribute("onchange","qrRowPicked(this)");
        t.closest(".card").appendChild(hid);
        var rows=t.closest(".card").querySelectorAll(".chat-row");
        rows.forEach(function(row,i){
          var q=(db.settings.quickReplies||[])[i]; if(!q) return;
          var box=document.createElement("div"); box.style.cssText="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px";
          if(q.image) box.innerHTML='<img src="'+q.image.data+'" style="height:48px;border-radius:6px">';
          box.innerHTML+='<button type="button" class="btn" onclick="qrRowImage('+i+')">🖼 '+(q.image?"Ganti gambar":"Tambah gambar")+'</button>'+(q.image?'<button type="button" class="btn" onclick="qrRowRemoveImage('+i+')">Hapus gambar</button>':"");
          var first=row.firstElementChild; if(first) first.appendChild(box);
        });
      }
    }catch(e){ console.error("QR gambar:",e); }
    return r;
  };

  /* ---- Di chat ---- */
  window.__qrPending=null;
  function clearPending(){
    window.__qrPending=null;
    var c=document.getElementById("qrChip"); if(c) c.remove();
  }
  window.qrDropImage=clearPending;

  var prevChoose=window.chooseQuickReply;
  window.chooseQuickReply=function(i){
    var q=(db.settings.quickReplies||[])[i];
    var r=prevChoose.apply(this,arguments);
    try{
      clearPending();
      if(q && q.image && q.image.data){
        window.__qrPending={chatId:window.__activeChatId,data:q.image.data,name:q.image.name||"balasan.jpg"};
        var el=document.getElementById("reply");
        if(el){
          var chip=document.createElement("div"); chip.id="qrChip";
          chip.style.cssText="display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:6px 8px;border:1px solid #d9c7ad;border-radius:10px;background:#fbf3e6;font-size:13px";
          chip.innerHTML='<img src="'+q.image.data+'" style="height:44px;border-radius:6px"><span style="flex:1">Gambar ikut terkirim bersama pesan ini</span><button type="button" class="btn" onclick="qrDropImage()">✕ Lepas</button>';
          el.parentNode.insertBefore(chip,el);
        }
      }
    }catch(e){ console.error("QR pilih:",e); }
    return r;
  };

  var prevOpen=window.openChat;
  window.openChat=function(){ clearPending(); return prevOpen.apply(this,arguments); };

  var prevSend=window.sendLocalReply;
  var busy=false;
  window.sendLocalReply=async function(id){
    var p=window.__qrPending;
    if(!p || String(p.chatId)!==String(id)) return prevSend.apply(this,arguments);
    if(busy) return;
    var x=db.inbox.find(function(z){return String(z.id)===String(id)}); if(!x) return;
    var input=document.getElementById("reply"), cap=(input&&input.value.trim())||"";
    var btn=[].slice.call(document.querySelectorAll(".chat-compose button")).find(function(b){return /Kirim Balasan|Mengirim/.test(b.textContent)});
    busy=true; if(btn){btn.disabled=true;btn.textContent="Mengirim…";}
    try{
      var blob=await (await fetch(p.data)).blob();
      var file=new File([blob],p.name,{type:blob.type||"image/jpeg"});
      await window.sendWhatsAppFile(x,file,cap);
    }catch(e){
      alert("Gambar/pesan belum terkirim: "+(e.message||e)+"\n\nKlik ✕ Lepas bila ingin mengirim teksnya saja.");
      busy=false; if(btn){btn.disabled=false;btn.textContent="Kirim Balasan";}
      return;
    }
    try{
      var label="📎 "+p.name+(cap?": "+cap:"");
      window.__sentMedia=window.__sentMedia||{}; window.__sentMedia[label]={url:p.data,type:"image/jpeg"};
      x.messages=x.messages||[];
      x.messages.push({dir:"out",text:label,time:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})});
      x.preview=label; x.unread=false; save();
      clearPending(); if(input) input.value="";
      if(document.querySelector(".booking-split-open")){saveBookingDraft(id);showBookingPanel(id);}else{prevOpen.call(window,id);}
    }catch(e){ console.error("Terkirim, tampilan gagal diperbarui:",e); }
    finally{ busy=false; }
  };
})();
</script>
<script>
/* Status "sudah dibaca" dibagi ke semua admin lewat server */
(function(){
  var sent={};
  function base(){ return (db.settings.apiBase||"").replace(/\/$/,""); }
  function tsOf(x){ return Number(x.last_message_at||x.timestamp||x.last_timestamp||0); }
  window.__markReadServer=function(id){
    try{
      if(!base()||!db.settings.apiKey) return;
      var x=db.inbox.find(function(z){return String(z.id)===String(id)});
      if(!x||!x.waConversation) return;
      var ts=tsOf(x);
      if(sent[id]!==undefined && sent[id]>=ts) return;
      sent[id]=ts;
      fetch(base()+"/api/read",{method:"POST",headers:{"Content-Type":"application/json","X-GOMA-API-KEY":db.settings.apiKey},body:JSON.stringify({chat_id:Number(id)})})
        .then(function(r){ if(!r.ok) delete sent[id]; })
        .catch(function(){ delete sent[id]; });
    }catch(_){}
  };
  var prevOpen=window.openChat;
  window.openChat=function(id){
    var r=prevOpen.apply(this,arguments);
    window.__markReadServer(id);
    return r;
  };
  /* Chat yang sedang terbuka: bila ada pesan baru masuk, ikut ditandai dibaca */
  setInterval(function(){
    if(document.hidden||location.hash!=="#inbox") return;
    var id=window.__activeChatId, m=document.getElementById("modal");
    if(id==null||!m||!m.classList.contains("open")) return;
    window.__markReadServer(id);
  },4000);
})();
</script>

(function(){

   "#fwdBox .fwd-prev{background:#f3e6d3;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;max-height:80px;overflow:auto}"+

   "#gomaToast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:100002;background:#4a2f1a;color:#fff;padding:9px 16px;border-radius:20px;font:600 13px system-ui,sans-serif}";
  document.head.appendChild(css);

  /* ---------- bantu ---------- */
  function mk(m){ return (m.dir||"")+"|"+(m.time||"")+"|"+String(m.text||"").slice(0,160); }
  function mmeta(x,m){ return (x.msgMeta&&x.msgMeta[mk(m)])||{}; }
  function setMeta(x,m,patch){
    x.msgMeta=x.msgMeta||{}; var k=mk(m), c=Object.assign({},x.msgMeta[k],patch);
    Object.keys(c).forEach(function(p){ if(!c[p]) delete c[p]; });
    if(Object.keys(c).length) x.msgMeta[k]=c; else delete x.msgMeta[k];

  }
  var MED=/^\[media\|([a-z0-9]*)\|([^\]]*)\]\s*([\s\S]*)$/i;
  function plain(t){

  }
  function rawText(t){ t=String(t||""); var m=t.match(MED); return m?(m[2]+(m[3]?"\n"+m[3]:"")):t.replace(/📎/g,"📄"); }
  function toast(msg){ var o=document.getElementById("gomaToast"); if(o)o.remove(); var d=document.createElement("div"); d.id="gomaToast"; d.textContent=msg; document.body.appendChild(d); setTimeout(function(){d.remove()},2200); }

  /* ---------- render bubble dengan penanda ---------- */

    var txt=rawText(m.text), box=document.createElement("div"); box.id="fwdBox";
    box.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(40,25,10,.45);display:flex;align-items:center;justify-content:center";
    box.innerHTML='<div class="fwd-card"><b style="font-size:16px">↪️ Teruskan pesan</b><div class="fwd-prev">'+E(plain(m.text).slice(0,200))+'</div><input id="fwdQ" class="input" placeholder="Cari nama atau nomor" autocomplete="off"><div id="fwdList" class="fwd-list"></div><div style="text-align:right;margin-top:8px"><button type="button" class="btn" id="fwdX">Batal</button></div></div>';
    document.body.appendChild(box);
    function paint(){
      var q=(document.getElementById("fwdQ").value||"").toLowerCase();
      var rows=db.inbox.filter(function(c){ return String(c.id)!==String(x.id)&&c.waConversation&&((c.name||"")+" "+(c.phone||"")).toLowerCase().indexOf(q)>=0; }).slice(0,40);
      document.getElementById("fwdList").innerHTML=rows.length?rows.map(function(c){return '<div class="fwd-row" data-id="'+E(c.id)+'"><b>'+E(c.name||c.phone)+'</b> <small>'+E(c.phone||"")+' · '+E(c.number||"")+'</small></div>'}).join(""):'<div class="label" style="padding:10px">Tidak ada chat yang cocok.</div>';
    }
    paint();
    document.getElementById("fwdQ").oninput=paint;
    document.getElementById("fwdX").onclick=closeFwd;
    box.addEventListener("click",async function(e){
      if(e.target===box) return closeFwd();
      var r=e.target.closest&&e.target.closest(".fwd-row"); if(!r) return;
      var t=db.inbox.find(function(c){return String(c.id)===String(r.dataset.id)}); if(!t) return;
      if(!confirm("Teruskan pesan ini ke "+(t.name||t.phone)+" ("+(t.number||"")+")?")) return;
      try{
        await sendWhatsAppText(t,txt);
        t.messages=t.messages||[]; t.messages.push({dir:"out",text:txt,time:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})});
        t.preview=txt; save(); closeFwd(); toast("Terkirim ke "+(t.name||t.phone));
      }catch(err){ alert("Pesan belum terteruskan: "+(err.message||err)); }
    });
  }

  document.addEventListener("click",function(e){
    var mi=e.target.closest&&e.target.closest("#msgMenu .mi");
    if(mi&&cur){
      var x=cur.x, m=cur.m, a=mi.dataset.m; closeMenu();
      if(a==="reply") doReply(x,m);
      else if(a==="copy") copyText(rawText(m.text));
      else if(a==="fwd") doForward(x,m);
      else if(a==="pin"){ var was=mmeta(x,m).pin; (x.messages||[]).forEach(function(o){ if(mmeta(x,o).pin) setMeta(x,o,{pin:0}); }); if(!was) setMeta(x,m,{pin:1}); rerender(x); }
      else if(a==="star"){ setMeta(x,m,{star:mmeta(x,m).star?0:1}); rerender(x); }
      else if(a==="booking"){
        // Sama seperti tombol "📅 Booking" di atas chat: tandai chat berstatus BOOKING
        // (muncul di filter & badge Booking, dan tercatat di halaman Booking).
        if(x.status==="BOOKING"){ toast("Chat ini sudah berstatus Booking"); }
        else{
          setChatStatus(x.id,"BOOKING",true);
          var bk=(db.bookings||[]).find(function(k){return k.inboxId===x.id;});
          if(bk&&!bk.note){ bk.note=plain(m.text); save(); }
          try{ openChat(x.id); }catch(_){}
          toast("Chat ditandai Booking");
        }
      }
      else if(a==="hide"){
        if(mmeta(x,m).hide){ setMeta(x,m,{hide:0}); }
        else{ if(!confirm("Hapus pesan ini dari tampilan CRM?\n\nPesan tetap ada di WhatsApp pelanggan dan tidak terhapus dari sana. Bisa ditampilkan lagi lewat tulisan 'Tampilkan' di atas chat.")) return; setMeta(x,m,{hide:1}); }
        rerender(x);
      }
      return;
    }
    var t=e.target.closest&&e.target.closest("#chatBody [data-act]");
    if(t){
      var act=t.dataset.act, ch=activeChat();
      if(act==="menu"){ e.preventDefault(); e.stopPropagation(); var r=t.getBoundingClientRect(); openMenu(t.dataset.i,r.left-150,r.bottom+4); return; }
      if(act==="gopin"){ var b=document.querySelector('#chatBody .bubble[data-i="'+t.dataset.i+'"]'); if(b) b.scrollIntoView({block:"center",behavior:"smooth"}); return; }
      if(act==="togglehidden"){ e.preventDefault(); if(ch){ ch.showHidden=!ch.showHidden; save(); rerender(ch); } return; }
    }
    if(!(e.target.closest&&e.target.closest("#msgMenu"))) closeMenu();
  },true);

  document.addEventListener("contextmenu",function(e){
    var b=e.target.closest&&e.target.closest("#chatBody .bubble[data-i]");
    if(!b||e.target.closest("a,video,audio")) return;
    e.preventDefault(); if(Date.now()-lastTouchOpen<700) return; lastCtx=Date.now(); openMenu(b.dataset.i,e.clientX,e.clientY);
  });
  var lp=null;
  document.addEventListener("touchstart",function(e){
    var b=e.target.closest&&e.target.closest("#chatBody .bubble[data-i]");
    if(!b||e.target.closest("a,video,audio")||!e.touches[0]) return;
    var t=e.touches[0]; lp={x:t.clientX,y:t.clientY,timer:setTimeout(function(){ if(Date.now()-lastCtx>700){ lastTouchOpen=Date.now(); openMenu(b.dataset.i,lp.x,lp.y); if(navigator.vibrate) navigator.vibrate(20);} },450)};
  },{passive:true});
  document.addEventListener("touchmove",function(e){ if(lp&&e.touches[0]&&(Math.abs(e.touches[0].clientX-lp.x)>10||Math.abs(e.touches[0].clientY-lp.y)>10)){clearTimeout(lp.timer);lp=null;} },{passive:true});
  ["touchend","touchcancel"].forEach(function(n){ document.addEventListener(n,function(){ if(lp){clearTimeout(lp.timer);lp=null;} },{passive:true}); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeMenu(); closeFwd(); } });
  window.addEventListener("scroll",closeMenu,true);

  /* ---------- kirim balasan dengan kutipan ---------- */
  var prevSend=window.sendLocalReply;
  window.sendLocalReply=async function(id){
    var r=window.__replyTo, input=document.getElementById("reply");
    if(!r||String(r.chatId)!==String(id)||!input) return prevSend.apply(this,arguments);
    var orig=input.value, body=orig.trim();
    if(!body&&!window.__qrPending) return prevSend.apply(this,arguments);
    var quote="> "+String(r.text||"").replace(/\s+/g," ").slice(0,120);
    var composed=quote+(body?"\n\n"+body:"");
    input.value=composed;
    await prevSend.apply(this,arguments);
    var el=document.getElementById("reply");
    if(el&&el.value===composed){ el.value=orig; }   // gagal terkirim: kembalikan teks asli
    else clearReply();
  };
  var prevOpen=window.openChat;
  window.openChat=function(){ clearReply(); closeMenu(); return prevOpen.apply(this,arguments); };
})();
</script>

<script>
/* Keluar (logout) + layar masuk */
(function(){
  var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(_){return null;}};

  window.gomaLogout=async function(){
    if(!confirm('Keluar dari Hai Goma CRM di perangkat ini?\n\nAPI Key dan cache inbox dihapus dari browser ini. Data booking, pasien, dan follow up tidak ikut terhapus.'))return;
    var base=(db.settings.apiBase||'').replace(/\/$/,''), key=db.settings.apiKey||'';
    // Matikan notifikasi HP ini supaya tidak terus menerima pesan setelah keluar.
    try{
      if('serviceWorker' in navigator){
        var reg=await navigator.serviceWorker.getRegistration();
        var sub=reg&&await reg.pushManager.getSubscription();
        if(sub){
          if(base&&key){
            try{await Promise.race([
              fetch(base+'/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json','X-GOMA-API-KEY':key},body:JSON.stringify({endpoint:sub.endpoint})}),
              new Promise(function(r){setTimeout(r,4000)})
            ]);}catch(_){}
          }
          await sub.unsubscribe();
        }
      }
    }catch(_){}
    LS('goma_push','0');
    if(base)LS('goma_last_base',base);
    LS('goma_loggedout','1');
    db.settings.apiKey='';
    db.settings.apiBase='';            // hentikan sinkronisasi inbox otomatis
    db.inbox=(db.inbox||[]).filter(function(x){return !x.waConversation;});
    save();
    location.hash='';
    location.reload();
  };

  function showLogin(){
    var o=document.createElement('div');o.id='gomaLogin';
    o.innerHTML='<form class="lg-card" autocomplete="off"><div class="lg-logo">G</div><h2>Hai Goma CRM</h2><p>Masukkan URL Worker dan API Key untuk masuk.</p>'
      +'<label for="lgBase">URL Worker API</label><input id="lgBase" type="url" inputmode="url" placeholder="https://nama-worker.workers.dev">'
      +'<label for="lgKey">GOMA API Key</label><input id="lgKey" type="password" autocomplete="current-password">'
      +'<div class="lg-err" id="lgErr" role="alert"></div><button type="submit" id="lgBtn">Masuk</button></form>';
    document.body.appendChild(o);
    document.getElementById('lgBase').value=LS('goma_last_base')||'';
    document.getElementById('lgKey').focus();
    o.querySelector('form').onsubmit=async function(e){
      e.preventDefault();
      var base=document.getElementById('lgBase').value.trim().replace(/\/$/,'');
      var key=document.getElementById('lgKey').value.trim();
      var err=document.getElementById('lgErr'),btn=document.getElementById('lgBtn');
      if(!/^https?:\/\//i.test(base)){err.textContent='URL Worker harus diawali https://';return;}
      if(!key){err.textContent='API Key wajib diisi.';return;}
      btn.disabled=true;btn.textContent='Memeriksa...';err.textContent='';
      try{
        // chat_id=0 sengaja tidak valid: 401 = key salah, 400 = key benar.
        var r=await fetch(base+'/api/read',{method:'POST',headers:{'Content-Type':'application/json','X-GOMA-API-KEY':key},body:JSON.stringify({chat_id:0})});
        if(r.status===401||r.status===403){err.textContent='API Key salah.';btn.disabled=false;btn.textContent='Masuk';return;}
      }catch(_){err.textContent='Tidak bisa terhubung ke Worker. Periksa URL dan koneksi.';btn.disabled=false;btn.textContent='Masuk';return;}
      db.settings.apiBase=base;db.settings.apiKey=key;save();
      LS('goma_loggedout',null);LS('goma_last_base',null);
      location.reload();
    };
  }
  if(LS('goma_loggedout')==='1'&&!db.settings.apiKey)showLogin();
})();
</script>

<script>
/* ============================================================
   SINKRONISASI DATA ANTAR PERANGKAT + ketik langsung di chat
   Data di-sync lewat Worker API (/api/state): pelanggan, booking,
   follow up, balasan cepat, pengaturan nomor/PIC, status & PIC chat.
   ============================================================ */
(function(){
  var SK='goma_sync_v1';
  var ARR={customers:function(){return db.customers;},bookings:function(){return db.bookings;},followups:function(){return db.followups;},quickReplies:function(){return db.settings.quickReplies;}};
  var SETTING_KEYS=['numbers','adminNames','picNames','numberPhones','broadcastNumberIds'];
  var NO_DEL={settings:1,chatmeta:1};
  var S;
  try{S=JSON.parse(localStorage.getItem(SK)||'null');}catch(_){S=null;}
  S=S||{cursor:0,snap:{},ver:{},pending:{}};
  S.snap=S.snap||{};S.ver=S.ver||{};S.pending=S.pending||{};
  var origSave=window.save, busy=false, timer=null, lastOk=0, lastErr='';

  function persistS(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(_){}}
  function cfg(){var b=(db.settings.apiBase||'').replace(/\/$/,''),k=db.settings.apiKey||'';return(b&&k&&localStorage.getItem('goma_loggedout')!=='1')?{b:b,k:k}:null;}
  function hdr(c){return {'Content-Type':'application/json','X-GOMA-API-KEY':c.k};}
  function byId(arr){var o={};(arr||[]).forEach(function(x){if(x&&x.id!=null)o[String(x.id)]=x;});return o;}

  function localView(){
    var v={};
    Object.keys(ARR).forEach(function(c){v[c]=byId(ARR[c]());});
    v.settings={};
    SETTING_KEYS.forEach(function(k){if(db.settings[k]!==undefined)v.settings[k]=db.settings[k];});
    v.chatmeta={};
    var sn=S.snap.chatmeta||{};
    (db.inbox||[]).forEach(function(x){
      if(x.status||x.pic||sn[String(x.id)]!==undefined)v.chatmeta[String(x.id)]={status:x.status||'',pic:x.pic||''};
    });
    return v;
  }

  function applyPendingMeta(){
    var ids=Object.keys(S.pending);if(!ids.length)return false;
    var changed=false;
    ids.forEach(function(id){
      var it=(db.inbox||[]).find(function(x){return String(x.id)===id;});
      if(it){var d=S.pending[id];it.status=d.status||'';it.pic=d.pic||'';delete S.pending[id];changed=true;
        (S.snap.chatmeta=S.snap.chatmeta||{})[id]=JSON.stringify({status:it.status,pic:it.pic});}
    });
    return changed;
  }

  function collectChanges(){
    var v=localView(),out=[];
    Object.keys(v).forEach(function(c){
      var cur=v[c],sn=S.snap[c]||{};
      Object.keys(cur).forEach(function(id){
        var str=JSON.stringify(cur[id]);
        if(sn[id]!==str)out.push({c:c,id:id,d:cur[id],_s:str});
      });
      if(!NO_DEL[c])Object.keys(sn).forEach(function(id){if(!(id in cur))out.push({c:c,id:id,del:true});});
    });
    return out;
  }

  async function push(c){
    var ch=collectChanges();
    for(var i=0;i<ch.length;i+=200){
      var part=ch.slice(i,i+200);
      var r=await fetch(c.b+'/api/state',{method:'POST',headers:hdr(c),body:JSON.stringify({records:part.map(function(x){return x.del?{c:x.c,id:x.id,del:true}:{c:x.c,id:x.id,d:x.d};})})});
      if(r.status===401||r.status===403)throw new Error('API Key ditolak');
      if(!r.ok)throw new Error('Kirim data gagal (HTTP '+r.status+')');
      part.forEach(function(x){
        var m=S.snap[x.c]=S.snap[x.c]||{};
        if(x.del)delete m[x.id];else m[x.id]=x._s;
      });
      persistS();
    }
    return ch.length;
  }

  function applyRemote(rec){
    var c=rec.c,id=String(rec.id),known=(S.ver[c]||{})[id]||0;
    if(rec.u<=known)return false;
    S.ver[c]=S.ver[c]||{};S.ver[c][id]=rec.u;
    S.snap[c]=S.snap[c]||{};
    if(ARR[c]){
      var arr=ARR[c](),idx=arr.findIndex(function(x){return String(x.id)===id;});
      if(rec.del){if(idx>=0)arr.splice(idx,1);delete S.snap[c][id];}
      else if(rec.d&&typeof rec.d==='object'){if(idx>=0)arr[idx]=rec.d;else arr.push(rec.d);S.snap[c][id]=JSON.stringify(rec.d);}
    }else if(c==='settings'){
      if(!rec.del&&rec.d!==null&&SETTING_KEYS.indexOf(id)>=0){db.settings[id]=rec.d;S.snap[c][id]=JSON.stringify(rec.d);}
    }else if(c==='chatmeta'){
      if(!rec.del&&rec.d){
        var it=(db.inbox||[]).find(function(x){return String(x.id)===id;});
        var meta={status:rec.d.status||'',pic:rec.d.pic||''};
        if(it){it.status=meta.status;it.pic=meta.pic;S.snap[c][id]=JSON.stringify(meta);}
        else S.pending[id]=meta;
      }
    }
    return true;
  }

  function dedupeCustomers(){
    var seen={},drop=[];
    db.customers.slice().sort(function(a,b){return Number(a.id)-Number(b.id);}).forEach(function(cu){
      var k=String(cu.phone||'').replace(/\D/g,'');
      if(k.length<8||/^g\d/.test(String(cu.phone||'')))return;
      if(seen[k])drop.push(cu);else seen[k]=cu;
    });
    if(drop.length)db.customers=db.customers.filter(function(cu){return drop.indexOf(cu)<0;});
    return drop.length>0;
  }

  async function pull(c){
    var changed=false,guard=0,more=true;
    while(more&&guard++<20){
      var r=await fetch(c.b+'/api/state?since='+Math.max(0,S.cursor-5000),{headers:hdr(c),cache:'no-store'});
      if(r.status===401||r.status===403)throw new Error('API Key ditolak');
      if(!r.ok)throw new Error('Ambil data gagal (HTTP '+r.status+')');
      var j=await r.json();
      (j.records||[]).forEach(function(rec){if(applyRemote(rec))changed=true;});
      more=!!j.more&&j.cursor>S.cursor;
      S.cursor=Math.max(S.cursor,j.cursor||0);
    }
    if(dedupeCustomers())changed=true;
    persistS();
    return changed;
  }

  function showStatus(){
    var el=document.getElementById('waConnectionStatus');if(!el)return;
    var sp=document.getElementById('gomaSyncStatus');
    if(!sp){sp=document.createElement('div');sp.id='gomaSyncStatus';sp.style.cssText='font-size:12px;margin-top:2px;opacity:.85';el.insertAdjacentElement('afterend',sp);}
    sp.textContent=lastErr?('Sinkron data gagal: '+lastErr):(lastOk?('Data tersinkron · '+new Date(lastOk).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})):'');
  }

  async function cycle(){
    if(busy)return;var c=cfg();if(!c)return;busy=true;
    try{
      var metaChanged=applyPendingMeta();
      await push(c);
      var changed=await pull(c);
      if(applyPendingMeta())changed=true;
      if(changed||metaChanged){
        origSave();
        var modalOpen=document.getElementById('modal')&&document.getElementById('modal').classList.contains('open');
        var tag=(document.activeElement&&document.activeElement.tagName)||'';
        if(!modalOpen&&!/INPUT|TEXTAREA|SELECT/.test(tag)){try{render();}catch(_){}}
      }
      lastOk=Date.now();lastErr='';
    }catch(e){lastErr=String(e&&e.message||e);}
    finally{busy=false;showStatus();}
  }

  // Setiap save() ikut memicu sinkron (ditunda sebentar).
  window.save=function(){
    var r=origSave.apply(this,arguments);
    clearTimeout(timer);timer=setTimeout(cycle,1000);
    return r;
  };
  window.gomaSyncNow=cycle;
  setInterval(function(){if(document.visibilityState==='visible')cycle();},8000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')cycle();});
  setTimeout(cycle,2500);

  /* ---------- Ketik langsung di chat tanpa klik kolom balasan ---------- */
  var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  function replyBox(){
    var m=document.getElementById('modal');
    if(!m||!m.classList.contains('open'))return null;
    return document.getElementById('reply');
  }
  function focusReply(){
    var el=replyBox();
    if(el&&document.activeElement!==el){try{el.focus({preventScroll:true});}catch(_){el.focus();}}
  }
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    var t=e.target,tag=(t&&t.tagName)||'';
    if(/INPUT|TEXTAREA|SELECT/.test(tag)||(t&&t.isContentEditable))return;
    var el=replyBox();if(!el)return;
    if(e.key&&e.key.length===1){el.focus();}   // huruf pertama ikut masuk ke kolom balasan
  },true);
  if(typeof window.openChat==='function'&&fine){
    var oc=window.openChat;
    window.openChat=function(){
      var r=oc.apply(this,arguments);
      setTimeout(focusReply,120);setTimeout(focusReply,700);
      return r;
    };
  }
})();
</script>
<script>
/* Info centang pesan: penjelasan melayang untuk nomor yang tidak punya status dibaca */
(function(){
  var lines={}, SEEN='goma_tick_note_seen';
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(_){return null;}}
  function loadLines(){
    var b=(db.settings.apiBase||'').replace(/\/$/,'');if(!b)return;
    fetch(b+'/api/health',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){if(j&&j.lines)lines=j.lines;}).catch(function(){});
  }
  loadLines();setTimeout(loadLines,5000);setInterval(loadLines,300000);
  function activeChat(){return (db.inbox||[]).find(function(z){return String(z.id)===String(window.__activeChatId);});}
  function provName(p){return p==='whacenter'?'WhaCenter':(p==='fonnte'?'Fonnte':'');}
  function closeCard(){var c=document.getElementById('tickInfo');if(c)c.remove();}
  function showCard(x,auto){
    closeCard();
    var p=lines[x&&x.number]||'', nm=provName(p), el=document.createElement('div');
    el.id='tickInfo';
    el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:100002;width:min(92vw,400px);background:#fffaf2;color:#3b2a1e;border:1px solid #d9c7ad;border-radius:14px;box-shadow:0 10px 30px rgba(60,35,10,.3);padding:14px 16px;font:14px/1.5 system-ui,sans-serif';
    var body=nm
      ?'<b>ℹ️ Tentang centang pesan</b><br>Nomor ini memakai gateway <b>'+nm+'</b>. Status “sampai” (✓✓) dan “sudah dibaca” (✓✓ biru) belum tersedia dari penyedia gateway, jadi pesan tetap tampil <b>✓</b> walaupun pelanggan sudah membacanya.<br><br><b>✓</b> = pesan sudah diterima sistem pengiriman WhatsApp. Kalau gagal, akan muncul tanda <span style="color:#c0392b"><b>⚠ gagal</b></span>.'
      :'<b>ℹ️ Arti centang pesan</b><br><b>✓</b> terkirim ke WhatsApp<br><b>✓✓</b> abu-abu: sampai di HP pelanggan<br><b>✓✓</b> <span style="color:#34b7f1"><b>biru</b></span>: sudah dibaca<br><span style="color:#c0392b"><b>⚠ gagal</b></span>: pesan tidak terkirim<br><span style="opacity:.75">Status dibaca tidak muncul bila pelanggan mematikan tanda baca di WhatsApp-nya.</span>';
    el.innerHTML=body+'<div style="text-align:right;margin-top:10px"><button type="button" style="background:#8a5a36;color:#fffaf0;border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer">Mengerti</button></div>';
    el.querySelector('button').onclick=function(){if(auto)ls(SEEN,'1');closeCard();};
    document.body.appendChild(el);
  }
  // Ketuk/klik centang -> tampilkan penjelasan.
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('[data-tkinfo]');
    if(!t)return;
    var x=activeChat();if(!x)return;
    e.preventDefault();e.stopPropagation();showCard(x,false);
  },true);
  // Sekali per perangkat: saat membuka chat nomor non-Meta yang sudah ada pesan keluar.
  if(typeof window.openChat==='function'){
    var oc=window.openChat;
    window.openChat=function(id){
      var r=oc.apply(this,arguments);
      setTimeout(function(){
        if(ls(SEEN)==='1'||document.getElementById('tickInfo'))return;
        var x=activeChat();if(!x||!provName(lines[x.number]))return;
        if(!(x.messages||[]).some(function(m){return m.dir==='out';}))return;
        showCard(x,true);
      },900);
      return r;
    };
  }
})();
</script>
<script>
/* Chat di HP/PWA ala WhatsApp: tidak zoom saat mengetik, pas di atas keyboard,
   dan tombol Kembali (gesture/tombol back) menutup chat. */
(function(){
  var st=document.createElement('style');
  st.textContent=
   '@media(max-width:900px){'
  +'input,textarea,select,.input{font-size:16px!important}'                       /* iOS zoom otomatis kalau < 16px */
  +'.modal-box:has(.chat-only){position:fixed!important;left:0!important;top:var(--vvt,0px)!important;width:100vw!important;height:var(--vvh,100dvh)!important;max-height:none!important;margin:0!important;border-radius:0!important}'
  +'.chat-only .chat-head{position:relative}'
  +'.chat-only .chat-head .close{min-width:44px;min-height:44px;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}'
  +'}';
  document.head.appendChild(st);

  // Ukuran layar yang benar-benar terlihat (di atas keyboard).
  var vv=window.visualViewport;
  function fit(){
    if(!vv)return;
    var r=document.documentElement.style;
    r.setProperty('--vvh',Math.round(vv.height)+'px');
    r.setProperty('--vvt',Math.round(vv.offsetTop)+'px');
  }
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit();}

  // Tombol/gesture Kembali menutup chat (hanya di layar HP).
  var mobile=function(){return window.matchMedia&&window.matchMedia('(max-width:900px)').matches;};
  var pushed=false, origClose=window.closeModal, origOpen=window.openChat;
  if(typeof origClose==='function'){
    window.closeModal=function(){
      var r=origClose.apply(this,arguments);
      if(pushed){pushed=false;try{history.back();}catch(_){}}
      return r;
    };
  }
  if(typeof origOpen==='function'){
    window.openChat=function(){
      var r=origOpen.apply(this,arguments);
      if(mobile()&&!pushed){try{history.pushState({gomaChat:1},'');pushed=true;}catch(_){}}
      return r;
    };
  }
  window.addEventListener('popstate',function(){
    if(pushed){pushed=false;try{origClose();}catch(_){}}
  });
})();
</script>
<script>
/* Chat di HP: header ringkas (tombol aksi bisa dibuka-tutup), otomatis ringkas saat keyboard muncul,
   tombol Kirim selalu terlihat. */
(function(){
  var st=document.createElement('style');
  st.textContent=
   '@media(max-width:900px){'
  +'.chat-only .chat-head .chat-tools,.chat-only .chat-head>.toolbar{display:none!important}'
  +'.chat-only .chat-head.tools-open .chat-tools{display:flex!important}'
  +'.chat-only .chat-head.tools-open>.toolbar{display:flex!important}'
  +'.chat-only .chat-head{padding-bottom:8px}'
  +'#toolsToggle{margin-top:6px;padding:7px 12px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:#fff7ee;color:var(--ink);font:600 13px system-ui,sans-serif}'
  +'.goma-kb .chat-only .chat-head .label,.goma-kb .chat-only .chat-head .chat-tools,.goma-kb .chat-only .chat-head>.toolbar,.goma-kb #toolsToggle{display:none!important}'
  +'.chat-only .chat-compose .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}'
  +'.chat-only .chat-compose .toolbar .btn.primary{flex:1 1 140px;min-height:44px}'
  +'}';
  document.head.appendChild(st);

  var mobile=function(){return window.matchMedia&&window.matchMedia('(max-width:900px)').matches;};
  var toolsOpen=false;

  // Tanda keyboard terbuka: area yang terlihat jauh lebih pendek dari layar.
  var vv=window.visualViewport;
  function kb(){
    var open=!!vv&&mobile()&&(window.innerHeight-vv.height>120);
    document.documentElement.classList.toggle('goma-kb',open);
  }
  if(vv){vv.addEventListener('resize',kb);kb();}

  function decorate(){
    if(!mobile())return;
    var head=document.querySelector('.chat-only .chat-head');
    if(!head||head.querySelector('#toolsToggle'))return;
    var x=(db.inbox||[]).find(function(z){return String(z.id)===String(window.__activeChatId);});
    var b=document.createElement('button');
    b.type='button';b.id='toolsToggle';
    function label(){b.textContent=(toolsOpen?'Tutup aksi ▴':'Aksi'+(x&&x.status?' · '+x.status:'')+' ▾');}
    label();
    b.onclick=function(){toolsOpen=!toolsOpen;head.classList.toggle('tools-open',toolsOpen);label();};
    head.classList.toggle('tools-open',toolsOpen);
    var lab=head.querySelector('.label');
    if(lab&&lab.parentNode)lab.insertAdjacentElement('afterend',b);else head.appendChild(b);
  }
  if(typeof window.openChat==='function'){
    var oc=window.openChat;
    window.openChat=function(){
      var r=oc.apply(this,arguments);
      setTimeout(decorate,0);
      return r;
    };
  }
})();
</script>
