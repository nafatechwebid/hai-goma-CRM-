<style>

/* GOMA Professional UI layer v3 — consistent warm palette and responsive layout */
:root{
 --bg:#f5eee5; --card:#fffaf3; --ink:#38271d; --muted:#7b6758;

 outline:3px solid var(--focus); outline-offset:2px

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><b>GOMA</b><span>WELLNESS CRM</span></div>
  <div class="nav" id="nav">
    <button data-page="dashboard" class="active">🏠 Dashboard</button>
    <button data-page="inbox">💬 Inbox <span class="pill danger" id="unreadBadge">0</span></button>
    <button data-page="customers">👤 Pasien</button>
    <button data-page="bookings">📅 Booking</button>
    <button data-page="followups">🔄 Follow Up</button>
    <button data-page="reports">📊 Laporan</button>
    <button data-page="settings">⚙️ Pengaturan</button>
  </div>
  <div class="side-foot"><button id="logoutBtn" type="button" onclick="gomaLogout()" title="Keluar" aria-label="Keluar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="nav-lbl">Keluar</span></button></div>
</aside>
<main class="main">
<div class="top"><div><button class="mobile-menu" onclick="toggleSide()">☰</button> <span style="color:var(--muted);font-size:12px">Hai Goma CRM</span><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><div id="liveClock" class="live-clock" aria-live="off">Memuat waktu...</div><button class="btn primary" onclick="openBooking()">+ Booking</button></div></div>
<div id="content"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script>
function jakartaNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));}
function jakartaTodayISO(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v={};p.forEach(x=>v[x.type]=x.value);return `${v.year}-${v.month}-${v.day}`;}
function formatJakartaDate(d){return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'long',year:'numeric'}).format(d);}
function updateLiveClock(){const el=document.getElementById('liveClock');if(!el)return;const now=new Date();el.textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now)+' WIB';}
const KEY='goma_crm_v2';
const defaultData={customers:[],bookings:[],followups:[],inbox:[],settings:{numbers:['GOMA 1','GOMA 2'],quickReplies:[]}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;
if(!db.settings) db.settings={numbers:['GOMA 1','GOMA 2']};
if(!Array.isArray(db.settings.numbers)) db.settings.numbers=['GOMA 1','GOMA 2'];
if(!Array.isArray(db.settings.quickReplies)) db.settings.quickReplies=[];
if(!Array.isArray(db.settings.adminNames)) db.settings.adminNames=[];
if(!Array.isArray(db.settings.picNames)) db.settings.picNames=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db));updateBadge()}
function updateBadge(){document.getElementById('unreadBadge').textContent=db.inbox.filter(x=>x.unread).length}
function rupiah(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function calc(b){
 const defaultTherapist=Math.round((Number(b.normal)||0)*.70);
 const therapist=b.therapistCommission!==undefined?Math.max(0,Number(b.therapistCommission)||0):defaultTherapist;
 let disc=b.discountType==='nominal'?Number(b.discount||0):(Number(b.normal)||0)*(Number(b.discount||0)/100);
 disc=Math.min(disc,Number(b.normal)||0);
 const calculatedCustomer=(Number(b.normal)||0)-disc;
 const customer=b.transferAmount!==undefined?Math.max(0,Number(b.transferAmount)||0):calculatedCustomer;
 const duration=Number(b.duration)||0;
 const shipping=duration<60?35000:0;
 const transportFree=duration>=60;
 const total=customer+shipping;
 const cancelled=String(b.operationalStatus||'').toUpperCase()==='CANCEL';
 return {therapist,discount:disc,customer:cancelled?0:customer,goma:cancelled?0:customer-therapist,shipping,transportFree,total:cancelled?0:total,duration};
}
function pageTitle(t){document.getElementById('pageTitle').textContent=t}
function render(){
 const p=location.hash.replace('#','')||'dashboard';
 document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
 const titles={dashboard:'Dashboard',inbox:'GOMA Inbox',customers:'Customer',bookings:'Booking',followups:'Follow Up',finance:'Keuangan',reports:'Laporan',settings:'Pengaturan'};
 pageTitle(titles[p]||'Dashboard'); window['render_'+p]?.(); updateBadge();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.page;document.getElementById('sidebar').classList.remove('open')});
window.onhashchange=render;
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function render_dashboard(){
 const today=jakartaTodayISO(); const bs=db.bookings.filter(b=>b.date===today);
 const fin=bs.reduce((a,b)=>{let c=calc(b);return {cust:a.cust+c.customer,goma:a.goma+c.goma,ther:a.ther+c.therapist}}, {cust:0,goma:0,ther:0});
 const __c=b=>String(b.operationalStatus||'').toUpperCase()==='CANCEL'||b.status==='CANCELLED',__ro=b=>window.gomaIsRO?window.gomaIsRO(b):false;
 const completed=db.bookings.filter(b=>b.status==='COMPLETED').length;
 const cancel=db.bookings.filter(b=>b.status==='CANCELLED').length;
 const newCust=db.customers.filter(c=>c.status==='BARU').length;
 const repeat=Math.max(0,db.customers.length-newCust);
 const sources=['Facebook Ads','Iklan WhatsApp','Instagram Ads','Manual'];
 let sourceRows=sources.map(s=>{let msgs=db.inbox.filter(x=>x.number&&((s==='Manual'&&x.number==='GOMA 4')||s!=='Manual')).length;let bok=db.bookings.filter(b=>b.source===s).length;return {s,msgs,bok}}).map(x=>`<tr><td>${x.s}</td><td>${x.msgs}</td><td>${x.bok}</td><td>${x.msgs?((x.bok/x.msgs)*100).toFixed(1):'0'}%</td></tr>`).join('');
 document.getElementById('content').innerHTML=`
 <div class="grid stats">
  <div class="card stat"><div class="label">Total Pesan Masuk</div><div class="value">${db.inbox.length}</div></div>
  <div class="card stat"><div class="label">Total Booking</div><div class="value">${db.bookings.length}</div></div>
  <div class="card stat"><div class="label">Booking Selesai</div><div class="value">${completed}</div></div>
 </div>
 <div class="grid two section">
  <div class="card"><div class="section-title"><h2>Ringkasan Hari Ini · ${formatJakartaDate(new Date())}</h2><span class="pill">${bs.length} booking</span></div>
   <div class="grid four">
    <div><div class="label">Booking</div><b>${bs.length}</b></div><div><div class="label">Jalan</div><b>${bs.filter(b=>!__c(b)).length}</b></div>
    <div><div class="label">Cancel</div><b>${bs.filter(b=>__c(b)).length}</b></div><div><div class="label">RO</div><b>${bs.filter(b=>__ro(b)).length}</b></div>
   </div>
  </div>
  <div class="card"><div class="section-title"><h2>Customer</h2></div>
   <div class="grid four"><div><div class="label">Total</div><b>${db.customers.length}</b></div><div><div class="label">Baru</div><b>${newCust}</b></div><div><div class="label">Repeat</div><b>${repeat}</b></div><div><div class="label">Follow Up</div><b>${db.followups.filter(x=>x.status==='OPEN').length}</b></div></div>
  </div>
 </div>
 <div class="card section"><div class="section-title"><h2>Konversi per Sumber</h2><span class="pill">Booking ÷ Pesan</span></div>
 <div class="table-wrap"><table><thead><tr><th>Sumber</th><th>Pesan</th><th>Booking</th><th>Conversion</th></tr></thead><tbody>${sourceRows}</tbody></table></div></div>
 <div class="card section"><div class="section-title"><h2>Status Customer</h2><span class="label">Klik status untuk membuka chat yang sudah terfilter</span></div>
 <div class="grid four">${['BARU','BOOKING','LANJUTKAN','FOLLOW UP','TIDAK ADA TERAPIS','CANCEL','SELESAI'].map(s=>`<div class="card status-card" onclick="openStatusChats('${s}')"><div class="label">${s}</div><div class="value">${db.customers.filter(c=>c.status===s).length}</div><small class="label">Lihat chat →</small></div>`).join('')}</div></div>`;
}
let inboxStatusFilter='';
let inboxPicFilter='';
function openStatusChats(status){ inboxStatusFilter=status; location.hash='inbox'; }
function render_inbox(){
 const unread=db.inbox.filter(x=>x.unread).length;
 const counts=db.settings.numbers.map(n=>({n,c:db.inbox.filter(x=>x.number===n&&x.unread).length}));
 const filtered=db.inbox.filter(x=>(!inboxStatusFilter || x.status===inboxStatusFilter)&&(!inboxPicFilter||x.pic===inboxPicFilter));
 document.getElementById('content').innerHTML=`
 <div class="card">
  <div class="section-title"><h2>Unified Inbox</h2><span id="waConnectionStatus" class="pill">Menunggu koneksi WhatsApp</span><div class="toolbar"><button class="btn ${!inboxStatusFilter?'primary':''}" onclick="inboxStatusFilter='';render_inbox()">Semua</button>${['BOOKING','CANCEL','TIDAK ADA TERAPIS','FOLLOW UP','LANJUTKAN','BARU','SELESAI'].map(s=>`<button class="btn ${inboxStatusFilter===s?'primary':''}" onclick="inboxStatusFilter=(inboxStatusFilter==='${s}'?'':'${s}');render_inbox()">${s}</button>`).join('')}</div></div>
  <div class="status-filter"><span class="pill">${inboxStatusFilter?'Status: '+inboxStatusFilter:'Semua status'}</span><span class="pill">${inboxPicFilter?'PIC: '+escapeHtml(inboxPicFilter):'Semua PIC'}</span><span class="pill danger">${unread} belum dibalas</span></div><div class="toolbar" style="margin-bottom:12px"><b style="font-size:12px;padding:9px 0">Filter PIC:</b><button class="btn ${!inboxPicFilter?'primary':''}" onclick="inboxPicFilter='';render_inbox()">Semua PIC</button>${(db.settings.picNames||[]).map(n=>`<button class="btn ${inboxPicFilter===n?'primary':''}" onclick="inboxPicFilter='${escapeHtml(n)}';render_inbox()">${escapeHtml(n)}</button>`).join('')}<button class="btn" onclick="addPICName()">+ Tambah PIC</button></div>
  <div class="inbox">
   <div class="numbers"><div class="number active" onclick="inboxStatusFilter='';render_inbox()"><b>Semua Nomor</b><span class="pill danger">${unread}</span></div>${counts.map(x=>`<div class="number" onclick="filterNumber('${x.n}')"><b>${x.n}</b> <span class="pill">${x.c}</span></div>`).join('')}</div>
   <div class="chat-list">${filtered.length?filtered.map(x=>`<div class="chat-row ${x.unread?'unread':''}" onclick="openChat(${x.id})"><div><b>${x.name}</b><div class="label">${x.preview}</div><span class="pill">${x.number}</span> ${statusPill(x.status||'UMUM')}</div><div style="text-align:right"><small>${x.time}</small>${x.unread?'<div class="danger">●</div>':''}</div></div>`).join(''):'<div class="empty">Tidak ada chat dengan status ini.</div>'}</div>
  </div>
 </div>`;
}
function filterNumber(n){ const rows=db.inbox.filter(x=>x.number===n); document.querySelector('.chat-list').innerHTML=rows.map(x=>`<div class="chat-row ${x.unread?'unread':''}" onclick="openChat(${x.id})"><div><b>${x.name}</b><div class="label">${x.preview}</div><span class="pill">${x.number}</span> ${statusPill(x.status||'UMUM')}</div><div>${x.time}</div></div>`).join('') || '<div class="empty">Tidak ada chat.</div>'; }
function addPICName(reopenChat=false,chatId=null){
 const name=prompt('Masukkan nama PIC/admin yang merespons:'); if(!name||!name.trim())return;
 const clean=name.trim();db.settings.picNames=db.settings.picNames||[];if(!db.settings.picNames.some(n=>n.toLowerCase()===clean.toLowerCase()))db.settings.picNames.push(clean);save();
 if(reopenChat&&chatId)openChat(chatId);else if(location.hash==='#inbox')render_inbox();else render_settings();
}
function addAdminName(){const name=prompt('Masukkan nama Admin untuk data booking/laporan:');if(!name||!name.trim())return;const clean=name.trim();db.settings.adminNames=db.settings.adminNames||[];if(!db.settings.adminNames.some(n=>n.toLowerCase()===clean.toLowerCase()))db.settings.adminNames.push(clean);save();render_settings();}
function removeNamedPerson(type,index){if(!confirm('Hapus nama dari daftar? Data booking/chat lama tidak ikut dihapus.'))return;const key=type==='admin'?'adminNames':'picNames';db.settings[key].splice(index,1);save();render_settings();}
function assignChatPIC(id,name){const x=db.inbox.find(z=>z.id===id);if(!x)return;x.pic=name||'';save();const body=document.getElementById('modalContent');if(body){const activeId=x.id;openChat(activeId)}if(location.hash==='#inbox')render_inbox();}
function chatMessages(x){
 if(!x.messages){x.messages=[{dir:'in',text:x.preview,time:x.time}];}
 return x.messages.map(m=>`<div class="bubble ${m.dir==='out'?'out':'in'}">${escapeHtml(m.text)}<div style="font-size:10px;opacity:.6;margin-top:4px">${m.time||''}</div></div>`).join('');
}
function escapeHtml(t){return String(t||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function openChat(id){
 window.__activeChatId=id;
 let x=db.inbox.find(z=>z.id===id); if(!x)return;

 x.unread=false; x.readTs=Number(x.last_message_at||x.timestamp||0)||Math.floor(Date.now()/1000); save();

 openModal(`<div class="chat-right chat-only">
   <div class="chat-right chat-only">
     <div class="chat-head">
       <button class="close" onclick="closeModal()">×</button>
       <h2>${escapeHtml(x.name)}</h2>
       <div class="label">${escapeHtml(x.phone)} · ${escapeHtml(x.number)}</div>
       <div class="chat-tools">
         <button class="btn ${x.status==='BOOKING'?'primary':''}" onclick="setChatStatus(${x.id},'BOOKING')">📅 Booking</button>
         <button class="btn ${x.status==='CANCEL'?'primary':''}" onclick="setChatStatus(${x.id},'CANCEL')">✕ Cancel</button>
         <button class="btn ${x.status==='TIDAK ADA TERAPIS'?'primary':''}" onclick="setChatStatus(${x.id},'TIDAK ADA TERAPIS')">👤 Tidak Ada Terapis</button>
         <button class="btn ${x.status==='LANJUTKAN'?'primary':''}" onclick="setChatStatus(${x.id},'LANJUTKAN')">▶ Lanjutkan</button>
         <button class="btn ${x.status==='FOLLOW UP'?'primary':''}" onclick="setChatStatus(${x.id},'FOLLOW UP')">🔄 Follow Up</button>
         <button class="btn ${x.status==='SELESAI'?'primary':''}" onclick="setChatStatus(${x.id},'SELESAI')">✓ Selesai</button>
         <button class="btn primary" onclick="showBookingPanel(${x.id})">+ Buat Booking</button>
       </div>
       <div class="toolbar" style="margin-top:8px;align-items:center">
         <span class="pill">Status: ${statusPill(x.status)}</span>
         <label style="min-width:190px;font-size:12px">PIC yang merespons<select class="input" onchange="assignChatPIC(${x.id},this.value)"><option value="">Belum ditugaskan</option>${(db.settings.picNames||[]).map(n=>`<option value="${escapeHtml(n)}" ${x.pic===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></label>
         <button class="btn" onclick="addPICName(true,${x.id})">+ Tambah nama PIC</button>
       </div>
     </div>
     <div class="chat-body" id="chatBody">${chatMessages(x)}</div>
     <div class="chat-compose">
       <div class="quick-wrap">
         <textarea id="reply" rows="2" class="input" placeholder="Tulis balasan... Ketik / untuk balasan cepat" oninput="quickReplyInput(this)" onkeydown="quickReplyKeydown(event)"></textarea>
         <div id="quickMenu" class="quick-menu hidden"></div>
       </div>
       <div class="toolbar" style="margin-top:8px">
         <button class="btn" onclick="insertQuickReplyPicker()">⚡ Balasan Cepat</button>
         <button type="button" class="btn primary" onclick="sendLocalReply(${x.id});return false">Kirim Balasan</button>
       </div>
     </div>
   </div>
 </div>`);

 const body=document.getElementById('chatBody');
 if(body) body.scrollTop=body.scrollHeight;
 bindChatWheel();
 if(x.waConversation)loadWhatsAppMessages(x.id);
}

function bindChatWheel(){
 const body=document.getElementById('chatBody');
 if(!body) return;
 body.addEventListener('wheel', e=>{
   if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
     body.scrollTop += e.deltaY;
     e.preventDefault();
     e.stopPropagation();
   }
 }, {passive:false});
}

function showBookingPanel(id){
 const x=db.inbox.find(z=>z.id===id); if(!x)return;
 const modal=document.querySelector('.modal-box');
 if(!modal)return;

 modal.classList.add('booking-split-open');
 modal.innerHTML=`<div class="booking-split">
   <section class="booking-panel">
     <div class="booking-panel-head">
       <div>
         <h2>📋 Buat Booking</h2>
         <div class="label">${escapeHtml(x.name)} · ${escapeHtml(x.phone)}</div>
       </div>
       <button class="close" onclick="closeBookingPanel()">×</button>
     </div>
     <div id="bookingPanelContent" class="booking-panel-scroll"></div>
   </section>
   <section class="chat-right booking-chat-side">
     <div class="chat-head">
       <button class="close" onclick="closeBookingPanel()">×</button>
       <h2>${escapeHtml(x.name)}</h2>
       <div class="label">${escapeHtml(x.phone)} · ${escapeHtml(x.number)}</div>
     </div>
     <div class="chat-body" id="chatBody">${chatMessages(x)}</div>

function calculatePaymentCode(amount,phone){
 const digits=String(phone||'').replace(/\D/g,'');
 const last2=(digits.slice(-2)||'00').padStart(2,'0');
 return Math.floor(amount/1000)*1000+500+Number(last2);
}

function previewChatBookingCost(){
 const first={
   name:document.getElementById('ibName')?.value||'-',
   gender:document.getElementById('ibGender')?.value||'-',
   service:document.getElementById('ibService')?.value||'-',
   duration:Number(document.getElementById('ibDuration')?.value||0),
   price:Number(document.getElementById('ibPrice')?.value||0),
   discount:Number(document.getElementById('ibDiscount')?.value||0),
   therapist:document.getElementById('ibTherapist')?.value||'-',
   extra10:document.getElementById('ibExtra10')?.value||''
 };
 const patients=[first,...getPatientRows()];
 let subtotal=0,shipping=0;
 patients.forEach(p=>{
   const disc=Math.min(p.price,p.price*(p.discount/100));
   subtotal+=Math.max(0,p.price-disc);
   shipping+=(Number(p.duration||0)+(p.extra10?10:0))<60?35000:0;
 });
 const rawTotal=subtotal+shipping;
 const phone=document.getElementById('ibPhone')?.value||'';
 const finalTotal=calculatePaymentCode(rawTotal,phone);
 const box=document.getElementById('bookingCostPreview');
 if(box) box.innerHTML=`<b>Ringkasan biaya</b><br>Subtotal setelah diskon: <b>${rupiah(subtotal)}</b><br>${shipping?`🚚 <b>Ongkir ${rupiah(shipping)}</b> — ada pasien dengan durasi di bawah 60 menit.`:`🚚 <b>Free Transport</b> — seluruh durasi 60 menit atau lebih.`}<br><span class="label">Kode pembayaran otomatis: angka 5 + 2 digit terakhir nomor WhatsApp customer.</span><br><br><b>Total pembayaran: ${rupiah(finalTotal)}</b>`;

function buildBookingCustomerMessage(d,subtotal,shipping,finalTotal){
 const fmtDate=v=>{if(!v)return '-';const [y,m,day]=v.split('-');return `${day}/${m}/${y}`;};
 const fmtTime=v=>String(v||'-').replace(':','.');
 const money=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Number(n||0));
 const patients=Array.isArray(d.patients)&&d.patients.length?d.patients:[{name:d.name,gender:d.gender,service:d.service,duration:d.duration,extra10:d.extra10,therapist:d.therapist}];
 const L=[
  '🎫 Detail Booking – GOMA Massage Service',
  `Tanggal Pemesanan: ${fmtDate(d.orderDate)}`,'',
  `Nama Pasien : ${d.name||patients[0]?.name||'-'}`,
  `Jenis Kelamin Pasien: ${d.gender||patients[0]?.gender||'-'}`,
  `Kontak yang bisa dihubungi : ${d.phone||'-'}`,'',
  `Tanggal & Jam Layanan: ${fmtDate(d.date)} - ${fmtTime(d.time)}`,'',
  'Jenis Layanan:'
 ];
 patients.forEach((p)=>{
  if(p.service)L.push(p.service);
  if(p.extra10)L.push(`Free xtra 10 mnt ${p.extra10}`);
 });
 L.push(shipping>0?`Transport : ${money(shipping)}`:'Free transport',
  `Total Durasi : ${patients.reduce((sum,p)=>sum+(Number(p.duration)||0)+(p.extra10?10:0),0)} mnt`,'',
  `Metode pembayaran : ${d.payment||'TRANSFER'}`);
 if((d.payment||'TRANSFER')==='TRANSFER'){
  L.push('• Seabank : 901402411699 A/N Amalia Azzahra',
   `• Total pembayaran : ${money(finalTotal)}`,
   '(masukkan 3 angka terakhir sebagai kode transfer)');
 }else if(d.payment==='TRANSFER DI TEMPAT'){
  L.push(`• Total pembayaran : ${money(finalTotal)}`,'• Transfer di tempat setelah selesai');
 }else{
  L.push(`• Total pembayaran : ${money(finalTotal)}`);
 }
 L.push('',`Jumlah Staf Terapis: ${Number(d.staffCount||d.staff||1)}`,
  `Catatan Khusus: ${d.note||'-'}`,'',
  `Alamat Lengkap : ${d.address||'-'}`,'',
  `Staf Terapis yang Ditugaskan: ${d.therapist||patients[0]?.therapist||'-'}`,'',
  '(Menyesuaikan jadwal & ketersediaan staf yang bertugas)','',
  'Kami infokan bahwa Goma adalah layanan kesehatan pijat profesional, tidak menerima layanan plus-plus atau sejenisnya.');
 return L.join('\n');
}

 x.bookingDraft=getBookingFormData();
 x.bookingDraftSavedAt=new Date().toISOString();
 save();
 // Tutup form dan kembali ke chat customer yang sama.
 openChat(id);
}

async function saveBookingFromChat(chatId){
 const x=db.inbox.find(z=>z.id===chatId); if(!x)return;
 const d=getBookingFormData();
 if(!d.name||!d.phone||!d.date||!d.time||!d.service||!d.duration||!d.price){
   alert('Mohon lengkapi data pasien utama, tanggal, jam, layanan, durasi, dan harga normal.');
   return;
 }
 let subtotal=0,shipping=0;
 d.patients.forEach(p=>{
   const disc=Math.min(+p.price||0,(+p.price||0)*(+p.discount||0)/100);
   subtotal+=Math.max(0,(+p.price||0)-disc);
   const dur=(+p.duration||0)+(p.extra10?10:0);
   shipping+=dur<60?35000:0;
 });
 const rawTotal=subtotal+shipping, finalTotal=calculatePaymentCode(rawTotal,d.phone);
 const msg=buildBookingCustomerMessage({...d,staffCount:d.staffCount},subtotal,shipping,finalTotal);
 // Kirim ringkasan ke WhatsApp customer lebih dulu (sebelumnya hanya dicatat di layar).
 const sendBtn=[...document.querySelectorAll('.booking-panel button')].find(b=>b.textContent.includes('Simpan & Kirim'));
 if(sendBtn){sendBtn.disabled=true;sendBtn.textContent='Mengirim…';}
 let sent=true,sendErr='';
 try{await sendWhatsAppText(x,msg);}catch(e){sent=false;sendErr=e.message||String(e);}
 x.status='BOOKING'; x.booking={...d,subtotal,shipping,rawTotal,finalTotal,summary:msg,createdAt:new Date().toISOString()};
 if(sent){
   x.bookingDraft=null;
   x.messages=x.messages||[]; x.messages.push({dir:'out',text:msg,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});
   x.preview='🎫 Booking dibuat · '+rupiah(finalTotal); x.unread=false;
 }else{
   x.bookingDraft=d; // form tetap terisi supaya bisa dicoba lagi
   x.preview='🎫 Booking tersimpan (ringkasan belum terkirim)';
 }
 const cst=db.customers.find(c=>c.phone===d.phone);
 if(cst){cst.status='BOOKING';cst.last=d.date}else db.customers.push({id:Date.now()+1,name:d.name,phone:d.phone,city:'',source:x.number,status:'BOOKING',last:d.date,notes:d.note||''});
 const bookingAdmin=(db.settings.adminNames||[]).includes(x.admin)?x.admin:((x.admin||'').trim()||((db.settings.adminNames||[])[0]||'Belum ditentukan'));
 const bookingRecord={id:Date.now(),customerId:0,inboxId:x.id,customer:d.name,phone:d.phone,address:d.address,treatment:d.service,duration:d.duration,normal:d.price,discountType:'percent',discount:d.discount,therapist:d.therapist,therapistPhone:d.therapistPhone||'',date:d.date,time:d.time,source:x.number,admin:bookingAdmin,payment:d.payment,status:'CONFIRMED',operationalStatus:'JALAN',transferAmount:finalTotal,transferDate:'',accountName:'',note:d.note||'',reportNote:'',extra10:Boolean(d.extra10),extra10Type:d.extra10,gender:d.gender,orderDate:d.orderDate,promo:d.promo,staffCount:d.staffCount,location:x.location||null,total:finalTotal,patients:d.patients};
 const existingBooking=db.bookings.find(b=>b.inboxId===x.id); if(existingBooking)Object.assign(existingBooking,bookingRecord,{id:existingBooking.id});else db.bookings.push(bookingRecord);
 save();
 // Kembali ke tampilan chat customer yang sama.
 try{openChat(chatId);}catch(e){console.error('Gagal membuka chat:',e);}
 if(!sent)alert('Booking sudah tersimpan, tetapi ringkasan BELUM terkirim ke WhatsApp:\n'+sendErr+'\n\nBuka + Buat Booking lagi lalu tekan Simpan & Kirim Ringkasan untuk mencoba ulang (tidak membuat booking ganda), atau kirim manual.');
}

function getQuickMatches(value){
 const m=String(value||'').match(/(?:^|\s)(\/[^\s]*)$/);
 if(!m)return {query:'',matches:[]};
 const query=m[1].toLowerCase();
 const sc=q=>{const t=String(q.shortcut||'').toLowerCase();return t.startsWith('/')?t:'/'+t};
 return {query,matches:db.settings.quickReplies.filter(q=>sc(q).startsWith(query)||String(q.title||'').toLowerCase().includes(query))};
}
function quickReplyInput(el){
 const menu=document.getElementById('quickMenu'); if(!menu)return;
 const {matches}=getQuickMatches(el.value);
 if(!matches.length){menu.classList.add('hidden');menu.innerHTML='';return;}
 menu.innerHTML=matches.map((q,i)=>`<div class="quick-item" data-quick-id="${q.id}" onclick="chooseQuickReply(${db.settings.quickReplies.indexOf(q)})"><b>${escapeHtml(q.shortcut)} · ${escapeHtml(q.title)}</b><small>${escapeHtml(q.text)}</small></div>`).join('');
 menu.classList.remove('hidden');
}
function quickReplyKeydown(e){
 if(e.key==='Escape'){document.getElementById('quickMenu')?.classList.add('hidden');return;}
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
   // Di HP/tablet (layar sentuh) Enter = baris baru seperti WhatsApp; kirim lewat tombol Kirim.
   if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)return;
   e.preventDefault();
   const menu=document.getElementById('quickMenu');
   if(menu&&!menu.classList.contains('hidden')){
     const first=menu.querySelector('.quick-item'); if(first){first.click();return;}
   }
   sendLocalReply(window.__activeChatId);
 }
}

function chooseQuickReply(id){
 const q=db.settings.quickReplies[id]; const el=document.getElementById('reply'); if(!q||!el)return;
 const m=el.value.match(/(?:^|\s)(\/[^\s]*)$/);
 el.value=m ? el.value.slice(0,m.index + (m[0].startsWith(' ') ? 1 : 0)) + q.text : q.text;
 document.getElementById('quickMenu')?.classList.add('hidden'); el.focus();
}

// Kirim satu pesan teks lewat Worker API. Melempar Error kalau gagal.
async function sendWhatsAppText(x,text){
 if(!db.settings.apiBase||!db.settings.apiKey)throw new Error('Koneksi WhatsApp belum lengkap. Buka Pengaturan, isi URL Worker API dan GOMA API Key.');
 const ids=db.settings.broadcastNumberIds||{'GOMA 1':'1246780911859619','GOMA 2':'6287896581305'};
 const phoneId=x.phoneNumberId||ids[x.number]||ids[String(x.number||'').toUpperCase()];
 if(!phoneId)throw new Error('Phone Number ID untuk '+(x.number||'nomor ini')+' belum disetel.');
 const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),20000);
 let r,j;
 try{
  r=await fetch(db.settings.apiBase.replace(/\/$/,'')+'/api/send',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','X-GOMA-API-KEY':db.settings.apiKey},body:JSON.stringify({phone_number_id:phoneId,to:x.phone,text})});
  j=await r.json().catch(()=>({}));
 }catch(e){
  throw new Error(e.name==='AbortError'?'Server tidak merespons dalam 20 detik (cek Worker API / Fonnte).':('Gagal terhubung ke Worker API: '+(e.message||e)));
 }finally{clearTimeout(tm);}
 if(r.status===401||r.status===403)throw new Error('API Key CRM tidak cocok dengan GOMA_API_KEY di Worker. Buka Pengaturan → Konfigurasi Broadcast API, isi GOMA API Key yang sama persis, lalu Simpan.');
 if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
 return j;
}

async function sendLocalReply(id){
 const x=db.inbox.find(z=>String(z.id)===String(id));
 const input=document.getElementById('reply');
 const text=input?.value.trim();
 if(!x||!text)return;
 const btn=[...document.querySelectorAll('.chat-compose button')].find(b=>b.textContent.includes('Kirim Balasan')||b.textContent.includes('Mengirim'));
 if(btn){btn.disabled=true;btn.textContent='Mengirim…';}
 try{
   await sendWhatsAppText(x,text);
 }catch(e){
   alert('Pesan belum terkirim ke WhatsApp: '+(e.message||'periksa koneksi API'));
   if(btn){btn.disabled=false;btn.textContent='Kirim Balasan';}
   return;
 }
 // Pesan SUDAH diterima Worker. Kalau pembaruan tampilan bermasalah, jangan
 // menampilkan "belum terkirim" karena itu menyesatkan.
 try{
   if(!x.messages)x.messages=[];
   x.messages.push({dir:'out',text,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});
   x.preview=text;x.unread=false;save();
   if(input)input.value='';
   if(document.querySelector('.booking-split-open')){saveBookingDraft(id);showBookingPanel(id);}else{openChat(id);}
 }catch(e){console.error('Pesan terkirim, tetapi gagal memperbarui tampilan:',e);}
}

// Sinkronisasi inbox langsung dari backend WhatsApp Cloud API.
let _gomaSyncBusy=false;
async function syncWhatsAppInbox(silent=true){
 if(_gomaSyncBusy||!db.settings.apiBase)return;
 _gomaSyncBusy=true;
 try{
  const headers={'Accept':'application/json'};
  if(db.settings.apiKey)headers['X-GOMA-API-KEY']=db.settings.apiKey;
  const r=await fetch(db.settings.apiBase.replace(/\/$/,'')+'/api/inbox',{headers,cache:'no-store'});
  const payload=await r.json();
  if(!r.ok)throw new Error(payload.error||('HTTP '+r.status));
  const rows=Array.isArray(payload)?payload:(payload.inbox||payload.data||[]);
  const existing=new Map((db.inbox||[]).map(x=>[String(x.id),x]));
  const live=rows.map(row=>{
    const prev=existing.get(String(row.id))||{};
    const phone=String(row.phone||row.customer_phone||row.wa_id||'');
    const number=row.number||row.source_label||row.source_name||row.source||'GOMA 1';
    const preview=row.preview??row.last_message??row.last_text??'';
    const rawTime=row.time||row.last_time||'';
    const timestamp=Number(row.timestamp||row.last_message_at||row.last_timestamp||0);
    const time=rawTime||(timestamp?new Date(timestamp*1000).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'}):'');
    return {...prev,...row,id:row.id,phone,name:row.name||row.customer_name||phone||'Customer',number,phoneNumberId:row.phoneNumberId||row.phone_number_id||'',preview:String(preview),time,unread:(prev.readTs&&timestamp&&timestamp<=prev.readTs)?false:(row.unread===undefined?(Number(row.unread_count||0)>0):(typeof row.unread==='boolean'?row.unread:Number(row.unread)>0)),status:prev.status||row.status||'BARU',pic:prev.pic||row.pic||'',waConversation:true,messages:Array.isArray(row.messages)?row.messages.map(m=>({dir:m.dir|| (m.direction==='out'?'out':'in'),text:m.text??m.message_text??m.message??'',time:m.time||(m.timestamp?new Date(Number(m.timestamp)*1000).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'}):''),status:m.status||''})):(prev.messages||[])};
  });
  const liveIds=new Set(live.map(x=>String(x.id)));
  const localOnly=(db.inbox||[]).filter(x=>!liveIds.has(String(x.id))&&!x.waConversation);
  db.inbox=[...live,...localOnly];
  for(const x of live){if(/^g\d{8,}$/.test(String(x.phone||'')))continue;let c=db.customers.find(c=>String(c.phone||'').replace(/\D/g,'')===String(x.phone||'').replace(/\D/g,''));if(!c){db.customers.push({id:Date.now()+Math.floor(Math.random()*10000),name:x.name,phone:x.phone,city:'',source:x.number,status:x.status||'BARU',last:jakartaTodayISO(),notes:''});}else{c.name=x.name||c.name;c.last=jakartaTodayISO();}}
  save();
  if(location.hash==='#inbox'&&(!document.getElementById('modal')?.classList.contains('open')||document.getElementById('modal')?.classList.contains('wa-dock')))render_inbox();
  const status=document.getElementById('waConnectionStatus');if(status)status.textContent='WhatsApp tersambung · '+live.length+' chat · '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 }catch(e){const status=document.getElementById('waConnectionStatus');if(status)status.textContent='Belum tersambung: '+(e.message||'cek URL backend');if(!silent)alert('Sinkronisasi inbox gagal: '+(e.message||e));}
 finally{_gomaSyncBusy=false;}
}

async function loadWhatsAppMessages(chatId){
 const x=db.inbox.find(z=>String(z.id)===String(chatId));
 if(!x||!x.waConversation||!db.settings.apiBase)return;
 try{
  const headers={'Accept':'application/json'};
  if(db.settings.apiKey)headers['X-GOMA-API-KEY']=db.settings.apiKey;
  const url=db.settings.apiBase.replace(/\/$/,'')+'/api/messages?chat_id='+encodeURIComponent(chatId);
  const r=await fetch(url,{headers,cache:'no-store'});
  const payload=await r.json();
  if(!r.ok)throw new Error(payload.error||('HTTP '+r.status));
  const rows=Array.isArray(payload)?payload:(payload.messages||payload.data||[]);
  x.messages=rows.map(m=>({dir:(m.direction==='out'||m.dir==='out')?'out':'in',text:String(m.text??m.message_text??m.message??''),time:m.time||(m.timestamp?new Date(Number(m.timestamp)*1000).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'}):''),status:m.status||''}));
  save();
  if(String(window.__activeChatId)===String(chatId)){
    const body=document.getElementById('chatBody');
    if(body){const near=body.scrollHeight-body.scrollTop-body.clientHeight<120;body.innerHTML=chatMessages(x);if(near||!body.dataset.init){body.scrollTop=body.scrollHeight;body.dataset.init='1';}}
  }
 }catch(e){console.warn('Tidak dapat memuat riwayat WhatsApp:',e);}
}

/* Universal date range filters: quick presets + calendar range, modeled on the supplied reference. */
const __dateFilterState = window.__dateFilterState || (window.__dateFilterState = {});
function __dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function __dateBounds(page){
 const s=__dateFilterState[page]||{preset:'all'}; const today=jakartaTodayISO(); let end=today,start=today; const d=new Date(today+'T12:00:00');
 if(s.preset==='all'){start='2000-01-01';end='2999-12-31'}
 else if(s.preset==='today'){start=end=today}
 else if(s.preset==='yesterday'){d.setDate(d.getDate()-1);start=end=__dateISO(d)}
 else if(['7days','14days','30days'].includes(s.preset)){d.setDate(d.getDate()-({7:6,14:13,30:29}[Number(s.preset.replace('days',''))]||6));start=__dateISO(d)}
 else if(s.preset==='lastmonth'){const n=new Date(d.getFullYear(),d.getMonth()-1,1);start=__dateISO(n);end=__dateISO(new Date(n.getFullYear(),n.getMonth()+1,0))}
 else if(s.preset==='thismonth'){start=today.slice(0,7)+'-01'}
 else if(s.preset==='week'){const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);start=__dateISO(d)}
 else if(s.preset==='month'){start=today.slice(0,7)+'-01'}
 else if(s.preset==='custom'){start=s.from||today;end=s.to||start}
 return {start,end,preset:s.preset};
}
function __dateToolbar(page){const b=__dateBounds(page),s=__dateFilterState[page]||{preset:'today'};const opts=[['realtime','Real-time'],['yesterday','Kemarin'],['7days','7 Hari Terakhir'],['30days','30 Hari Terakhir'],['day','Per Hari'],['week','Per Minggu'],['month','Per Bulan']];return `<div class="universal-datebar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0;padding:12px;border:1px solid var(--line,#e5d3c1);border-radius:12px;background:var(--card,#fffaf4)"><div style="display:flex;gap:6px;flex-wrap:wrap;flex:1">${opts.map(([v,l])=>`<button type="button" class="btn ${s.preset===v?'primary':''}" onclick="setUniversalDate('${page}','${v}')">${l}</button>`).join('')}</div><label style="min-width:140px;font-size:12px">Dari tanggal<input class="input" type="date" id="udFrom-${page}" value="${b.start}" style="display:block;margin-top:4px"></label><label style="min-width:140px;font-size:12px">Sampai tanggal<input class="input" type="date" id="udTo-${page}" value="${b.end}" style="display:block;margin-top:4px"></label><label style="min-width:145px;font-size:12px">Bulan rekap<input class="input" type="month" id="udMonth-${page}" min="2020-01" max="3000-12" value="${b.start.slice(0,7)===b.end.slice(0,7)?b.start.slice(0,7):''}" style="display:block;margin-top:4px" aria-label="Pilih bulan rekap sampai Desember 3000"></label><button type="button" class="btn primary" onclick="applyUniversalDate('${page}')">Terapkan tanggal</button><span class="label" style="width:100%">Periode: ${b.start} sampai ${b.end}</span></div>`}
function setUniversalDate(page,preset){const st=__dateFilterState[page]||{};st.preset=preset;__dateFilterState[page]=st;const fn=window['render_'+page];if(fn)fn()}
function applyUniversalDate(page){const from=document.getElementById('udFrom-'+page)?.value||jakartaTodayISO(),to=document.getElementById('udTo-'+page)?.value||from,month=document.getElementById('udMonth-'+page)?.value;let a=from,z=to;if(month){a=month+'-01';const d=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0);z=__dateISO(d)}__dateFilterState[page]={preset:'custom',from:a,to:z};const fn=window['render_'+page];if(fn)fn()}
function __inRange(v,page){const b=__dateBounds(page);v=String(v||'').slice(0,10);return !v||(v>=b.start&&v<=b.end)}
function __injectDatebar(page){const content=document.getElementById('content');if(!content||content.querySelector('.universal-datebar'))return;const card=content.querySelector('.card');if(!card)return;const heading=card.querySelector('.section-title');if(heading)heading.insertAdjacentHTML('afterend',__dateToolbar(page));else card.insertAdjacentHTML('afterbegin',__dateToolbar(page));}
function __filterRowsByRecords(page,records,dateFn,selector='tbody tr'){const b=__dateBounds(page);const rows=[...document.querySelectorAll(selector)];rows.forEach((row,i)=>{const rec=records[i];const date=rec?dateFn(rec):'';row.style.display=(!date||(date>=b.start&&date<=b.end))?'':'none'});}

render_reports=function(){__renderReportsDateBase();__injectDatebar('reports');const b=__dateBounds('reports');const arr=db.bookings.filter(x=>x.date>=b.start&&x.date<=b.end);const admins=[...new Set(arr.map(x=>String(x.admin||'').trim()).filter(Boolean))].sort();const rows=admins.map(a=>{const bs=arr.filter(x=>x.admin===a),done=bs.filter(x=>x.status==='COMPLETED'||x.status==='SELESAI'),paid=bs.reduce((s,x)=>s+calc(x).customer,0),goma=bs.reduce((s,x)=>s+calc(x).goma,0);return `<tr><td>${escapeHtml(a)}</td><td>${bs.length}</td><td>${done.length}</td><td>${rupiah(paid)}</td><td>${rupiah(goma)}</td></tr>`}).join('');const total=arr.length,completed=arr.filter(x=>x.status==='COMPLETED'||x.status==='SELESAI').length,cancelled=arr.filter(x=>x.status==='CANCELLED'||x.status==='CANCEL').length;const cards=document.querySelectorAll('#content .grid.four .card .value');if(cards[0])cards[0].textContent=total;if(cards[1])cards[1].textContent=completed;if(cards[2])cards[2].textContent=cancelled;if(cards[3])cards[3].textContent=(total?(completed/total*100).toFixed(1):'0')+'%';const tbody=[...document.querySelectorAll('#content tbody')].find(t=>t.closest('.card')?.textContent.includes('Kinerja Admin/PIC'));if(tbody)tbody.innerHTML=rows||'<tr><td colspan="5">Belum ada data pada periode ini.</td></tr>';}

function ensureTags(c){
 if(!Array.isArray(c.tags)){c.tags=[];if(c.status&&GOMA_TAGS.includes(c.status))c.tags.push(c.status);}

}

function financeBounds(preset,from,to){
 const today=jakartaTodayISO(),d=new Date(today+'T12:00:00+07:00');let start=today,end=today;
 if(preset==='yesterday'){d.setDate(d.getDate()-1);start=end=d.toISOString().slice(0,10)}
 else if(['7days','14days','30days'].includes(preset)){d.setDate(d.getDate()-({7:6,14:13,30:29}[Number(preset.replace('days',''))]||6));start=d.toISOString().slice(0,10);end=today}
 else if(preset==='lastmonth'){d.setDate(1);d.setMonth(d.getMonth()-1);start=d.toISOString().slice(0,7)+'-01';const last=new Date(d.getFullYear(),d.getMonth()+1,0);end=last.getFullYear()+'-'+String(last.getMonth()+1).padStart(2,'0')+'-'+String(last.getDate()).padStart(2,'0')}
 else if(preset==='thismonth'){start=today.slice(0,7)+'-01';end=today}
 else if(preset==='custom'){start=from||today;end=to||start}
 return {start,end};
}

 const today=jakartaTodayISO();
 document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><h2>Broadcast WhatsApp</h2><span class="pill">Pilih penerima terlebih dahulu</span></div>

async function sendBroadcast(){
 const ids=[...document.querySelectorAll('.bcPick:checked')].map(x=>Number(x.value)),text=document.getElementById('bcMessage')?.value.trim(),sender=document.getElementById('bcSender')?.value;
 if(!ids.length)return alert('Pilih minimal satu customer.');if(!text)return alert('Isi pesan broadcast terlebih dahulu.');
 if(!db.settings.apiBase||!db.settings.apiKey)return alert('Atur URL API Worker dan GOMA API Key di Pengaturan terlebih dahulu.');
 if(window.__bcRunning)return alert('Broadcast sebelumnya masih berjalan.');
 const BC_DELAY=10000;
 if(!confirm(`Kirim pesan ke ${ids.length} nomor melalui ${sender}?\nJeda 10 detik per pesan (estimasi ${Math.ceil(ids.length*10/60)} menit). Jangan tutup tab ini selama proses.`))return;
 window.__bcRunning=true;const bcBtn=[...document.querySelectorAll('button')].find(x=>(x.getAttribute('onclick')||'').includes('sendBroadcast'));const bcLabel=bcBtn?.textContent;
 const phoneId=db.settings.broadcastNumberIds?.[sender];let ok=0,failed=[];
 let idx=0;
 try{
 for(const id of ids){idx++;if(bcBtn){bcBtn.disabled=true;bcBtn.textContent=`Mengirim ${idx}/${ids.length}…`}
 const c=db.customers.find(x=>x.id===id);if(!c?.phone) {failed.push((c?.name||id)+': nomor kosong');continue}
 try{const r=await fetch(db.settings.apiBase.replace(/\/$/,'')+'/api/send',{method:'POST',headers:{'Content-Type':'application/json','X-GOMA-API-KEY':db.settings.apiKey},body:JSON.stringify({phone_number_id:phoneId,to:c.phone,text})});const j=await r.json();if(!r.ok||!j.ok)failed.push((c.name||c.phone)+': '+(j.error||r.status));else ok++}catch(e){failed.push((c.name||c.phone)+': koneksi gagal')}
 if(idx<ids.length)await new Promise(r=>setTimeout(r,BC_DELAY));
 }
 }finally{window.__bcRunning=false;if(bcBtn){bcBtn.disabled=false;bcBtn.textContent=bcLabel}}
 alert(`Hasil broadcast: ${ok} berhasil, ${failed.length} gagal.`+(failed.length?'\n\n'+failed.slice(0,8).join('\n'):''));
}

 document.getElementById('content').innerHTML=`<div class="grid four"><div class="card stat"><div class="label">Booking</div><div class="value">${total}</div></div><div class="card stat"><div class="label">Selesai</div><div class="value">${completed}</div></div><div class="card stat"><div class="label">Cancel</div><div class="value">${cancelled}</div></div><div class="card stat"><div class="label">Completion Rate</div><div class="value">${total?((completed/total)*100).toFixed(1):0}%</div></div></div><div class="card section"><h2>Rincian Booking Operasional</h2><p class="label">Data otomatis dibuat ketika booking disimpan dari Inbox. Perbarui status menjadi JALAN atau CANCEL. CANCEL bernilai Rp0 dan tidak masuk ke Keuangan.</p><div class="table-wrap"><table style="min-width:1500px"><thead><tr><th>Tanggal Invoice</th><th>ADMIN</th><th>Nama Pasien</th><th>No Pasien</th><th>Terapis</th><th>WA Terapis</th><th>Alamat</th><th>Waktu Sesi</th><th>Status</th><th>Keterangan</th><th>Pendapatan GOMA</th></tr></thead><tbody>${reportRows||'<tr><td colspan="11">Belum ada booking dari Inbox.</td></tr>'}</tbody></table></div></div><div class="card section"><h2>Kinerja Admin/PIC</h2><p class="label">Booking dan booking selesai dikelompokkan berdasarkan Admin yang diisi di data booking.</p><div class="table-wrap"><table><thead><tr><th>Admin/PIC</th><th>Booking</th><th>Selesai</th><th>Customer Bayar</th><th>Pendapatan GOMA</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Belum ada data booking.</td></tr>'}</tbody></table></div></div><div class="card section"><h2>Laporan Operasional</h2><p class="label">Ringkasan dihitung dari data booking yang tersimpan di browser ini.</p></div>`;

const _calcBeforeTransfer = calc;
calc = function(b){
  const base = _calcBeforeTransfer(b);
  const customer = (b && b.transferAmount !== undefined && b.transferAmount !== null && b.transferAmount !== '') ? Math.max(0, Number(b.transferAmount)||0) : base.customer;
  const therapist = (b && b.therapistCommission !== undefined && b.therapistCommission !== null && b.therapistCommission !== '') ? Math.max(0, Number(b.therapistCommission)||0) : base.therapist;
  return {...base, customer, therapist, goma: customer-therapist, total:customer};
};

<script>
/* Status workflow v5: toggle status, menu bulat per chat, booking/keuangan hanya dari chat BOOKING, status JALAN/CANCEL. */
(function(){
  const css=document.createElement('style');
  css.textContent='.st-tools{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}.st-tools .btn{padding:4px 9px;min-width:30px}.st-dot{color:#7a4a2a}.status-menu{position:fixed;z-index:9999;background:#fffaf4;border:1px solid #d7c2ae;border-radius:12px;box-shadow:0 8px 28px rgba(60,35,20,.25);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:190px}.status-menu .btn{text-align:left}';
  document.head.appendChild(css);
  const STATUSES=['BOOKING','CANCEL','TIDAK ADA TERAPIS','FOLLOW UP','LANJUTKAN','BARU','SELESAI'];
  function closeMenu(){document.querySelectorAll('.status-menu').forEach(m=>m.remove());}
  document.addEventListener('click',e=>{if(!e.target.closest('.status-menu')&&!e.target.closest('.st-dot'))closeMenu();});
  window.openStatusMenu=function(id,el){
    closeMenu();
    const x=db.inbox.find(z=>z.id===id); if(!x)return;
    const m=document.createElement('div'); m.className='status-menu';
    m.innerHTML=STATUSES.map(st=>'<button class="btn '+(x.status===st?'primary':'')+'" data-st="'+st+'">'+(x.status===st?'✓ ':'')+st+'</button>').join('')+'<button class="btn" data-st="">✕ Chat umum (tanpa status)</button>';
    document.body.appendChild(m);
    const r=el.getBoundingClientRect();
    m.style.top=Math.min(r.bottom+4,window.innerHeight-m.offsetHeight-8)+'px';
    m.style.left=Math.max(8,Math.min(r.right-m.offsetWidth,window.innerWidth-m.offsetWidth-8))+'px';
    m.querySelectorAll('button').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation(); const st=b.dataset.st; closeMenu();
      if(st==='')clearChatStatus(id); else if(x.status!==st)setChatStatus(id,st,true);
    });
  };
  window.clearChatStatus=function(id){
    const x=db.inbox.find(z=>z.id===id); if(!x)return;
    if(x.status)setChatStatus(id,x.status,true);
  };
  // Booking hanya tampil/terhitung jika chat asalnya berstatus BOOKING (booking manual tanpa chat tetap tampil).
  window.bookingVisible=function(b){
    if(!b||!b.inboxId)return true;
    const c=db.inbox.find(x=>x.id===b.inboxId);
    return !c||c.status==='BOOKING';
  };
  function wrap(name,extra){
    const prior=window[name]; if(typeof prior!=='function')return;
    window[name]=function(){
      const all=db.bookings;
      db.bookings=all.filter(b=>bookingVisible(b)&&(!extra||extra(b)));
      try{return prior.apply(this,arguments);}finally{db.bookings=all;}
    };
  }
  const hasContent=b=>!!(b.treatment||Number(b.normal)>0||Number(b.transferAmount)>0);
  wrap('render_bookings'); wrap('render_dashboard'); wrap('render_reports'); wrap('render_finance',hasContent);
  window.setBookingOperational=function(id,v){
    const b=db.bookings.find(x=>x.id===id); if(!b)return;
    b.operationalStatus=v==='CANCEL'?'CANCEL':'JALAN';
    if(v==='CANCEL')b.status='CANCELLED'; else if(b.status==='CANCELLED')b.status='CONFIRMED';
    save(); render_bookings();
  };
  window.bookingRow=function(b){
    const c=calc(b), e=escapeHtml;
    const op=(String(b.operationalStatus||'').toUpperCase()==='CANCEL'||b.status==='CANCELLED')?'CANCEL':'JALAN';
    return '<tr><td><b>'+e(b.customer)+'</b><br><small>'+e(b.phone)+'</small></td><td>'+e(b.treatment||'-')+'<br>'+(b.duration||0)+' menit</td><td>'+e(b.date)+'<br>'+e(b.time)+'</td><td>'+rupiah(b.normal)+'</td><td>'+(b.discountType==='nominal'?rupiah(c.discount):((b.discount||0)+'%'))+'</td><td class="money">'+rupiah(c.customer)+'</td><td><select class="input" style="min-width:95px" onchange="setBookingOperational('+b.id+',this.value)"><option value="JALAN"'+(op==='JALAN'?' selected':'')+'>Jalan</option><option value="CANCEL"'+(op==='CANCEL'?' selected':'')+'>Cancel</option></select></td><td>'+e(b.admin||'Belum ditentukan')+'<br><button class="btn" onclick="openBooking('+b.id+')">Edit</button></td></tr>';
  };
})();
</script>

  function tickHtml(st){
    st=String(st||'sent').toLowerCase();
    if(st==='failed')return ' <span title="Gagal terkirim" style="color:#c0392b;font-weight:700;margin-left:4px">⚠ gagal</span>';
    if(st==='read')return ' <span data-tkinfo="1" title="Sudah dibaca" style="cursor:help;color:#34b7f1;font-weight:700;margin-left:4px;letter-spacing:-2px">✓✓</span>';
    if(st==='delivered')return ' <span data-tkinfo="1" title="Sampai di HP penerima" style="cursor:help;opacity:.6;font-weight:700;margin-left:4px;letter-spacing:-2px">✓✓</span>';
    return ' <span data-tkinfo="1" title="Ketuk untuk info status" style="cursor:help;opacity:.6;font-weight:700;margin-left:4px">✓</span>';
  }
  chatMessages=function(x){
    if(!x.messages){x.messages=[{dir:'in',text:x.preview,time:x.time}];}
    return x.messages.map(m=>{
      const t=String(m.text||''), mm=t.match(MEDIA);
      let inner;
      if(mm)inner=mediaHtml(mm[1].toLowerCase(),mm[2],mm[3]);
      else if(t.startsWith('📎 ')&&window.__sentMedia[t]){const sm=window.__sentMedia[t],u=E(sm.url);inner=(/^image\//.test(sm.type)?'<img src="'+u+'" style="max-width:260px;max-height:320px;border-radius:8px;display:block">':/^video\//.test(sm.type)?'<video src="'+u+'" controls style="max-width:280px;border-radius:8px;display:block"></video>':'')+'<div>'+E(t.replace(/📎/g,'📄'))+'</div>';}
      else inner=linkify(t.replace(/📎/g,'📄'));
      return `<div class="bubble ${m.dir==='out'?'out':'in'}">${inner}<div style="font-size:10px;margin-top:4px"><span style="opacity:.6">${E(m.time||'')}</span>${m.dir==='out'?tickHtml(m.status):''}</div></div>`;
    }).join('');
  };
  openCustomerMaps=function(id){const x=db.inbox.find(z=>z.id===id);if(!x)return;const u=(x.location&&x.location.mapsUrl)||findMapsUrl(x);if(u)window.open(u,'_blank','noopener');else alert('Lokasi customer belum tersedia. Minta customer mengirim Share Location terlebih dahulu.');};
  openCustomerLocation=function(){const x=db.inbox.find(z=>z.id===window.__activeChatId);const u=x&&((x.location&&x.location.mapsUrl)||findMapsUrl(x));if(u)window.open(u,'_blank','noopener');else alert('Customer belum mengirim Share Location.');};
  useCustomerLocation=function(id){const x=db.inbox.find(z=>z.id===id);if(!x)return;const u=(x.location&&x.location.mapsUrl)||findMapsUrl(x);const st=document.getElementById('ibLocationState');if(u){x.location=Object.assign({},x.location,{mapsUrl:u});if(st)st.textContent='📍 Lokasi customer tersedia';const a=document.getElementById('ibAddress');if(a&&!a.value)a.value=u;}else{const m=prompt('Lokasi belum diterima. Tempel link Google Maps dari customer:');if(m){x.location={mapsUrl:m};if(st)st.textContent='📍 Lokasi customer tersimpan';}}};
  // ---- chat yang sedang terbuka ikut menyegarkan pesan baru & otomatis ditandai terbaca ----
  setInterval(async()=>{
    if(document.hidden||location.hash!=='#inbox')return;
    const id=window.__activeChatId, m=document.getElementById('modal');
    if(!id||!m||!m.classList.contains('open'))return;
    const x=db.inbox.find(z=>z.id===id); if(!x)return;
    try{await loadWhatsAppMessages(id);}catch(e){}
    const ts=Number(x.last_message_at||x.timestamp||0);
    if(x.unread||(ts&&ts>(x.readTs||0))){x.unread=false;x.readTs=ts||Math.floor(Date.now()/1000);save();render_inbox();}
  },4000);
  const _r=render;
  render=function(){
    const pg=location.hash.replace('#','')||'dashboard';
    const prev=S.pageNow; S.pageNow=pg;
    document.body.className=document.body.className.replace(/\bpg-\S+/g,'').trim()+' pg-'+pg;
    if(pg!==prev){ S.q=S.q; if(pg!=='inbox'){S.page=pg; if(SECTION_PAGES.includes(pg)&&S.sel[pg]==null&&pg==='settings')S.sel[pg]=0;} document.getElementById('mpSearch').parentElement.style.display=pg==='inbox'?'':'none'; if(pg!=='inbox'){S.q='';} }
    if(pg==='inbox'){ $('mpSearch').parentElement.style.display=''; S.q=prev==='inbox'?S.q:''; }
    const r=_r.apply(this,arguments);
    if(pg!=='inbox'){S.page=pg; buildMid(pg===prev); applySection(); applyRows(); focusBooking();}
    return r;
  };
  window.onhashchange=render;
  const _ri=window.render_inbox;
  setTimeout(()=>{try{render()}catch(e){console.error(e)}},0);
})();
</script>

<script>
/* GOMA CRM Search & Workflow polish v4. Keeps existing layout/data model and adds live search. */
(function(){
  const searchPages = new Set(['inbox','customers','bookings','followups','finance','reports','broadcast']);
  const searchState = window.__gomaSearchState || (window.__gomaSearchState = {});
  const pageNow = () => (location.hash.replace('#','') || 'dashboard').toLowerCase();

  function filterRows(input, scope){
    const q=(input.value||'').trim().toLocaleLowerCase('id-ID');
    searchState[scope]=q;
    const root=document.getElementById('content');
    if(!root)return;
    if(scope==='inbox'){
      root.querySelectorAll('.chat-list .chat-row').forEach(row=>{
        const hay=(row.innerText||'').toLocaleLowerCase('id-ID');
        row.style.display=(!q||hay.includes(q))?'':'none';
      });
      const visible=[...root.querySelectorAll('.chat-list .chat-row')].filter(r=>r.style.display!=='none').length;
      let note=root.querySelector('#gomaSearchResult');
      if(!note){
        note=document.createElement('div'); note.id='gomaSearchResult'; note.className='label';
        input.insertAdjacentElement('afterend',note);
      }
      note.textContent=q?`${visible} chat cocok`:'Cari berdasarkan nama atau nomor WhatsApp.';
      return;
    }
    if(scope==='broadcast'){
      root.querySelectorAll('#bcRecipients tr').forEach(row=>{
        const hay=(row.innerText||'').toLocaleLowerCase('id-ID');
        row.style.display=(!q||hay.includes(q))?'':'none';
      });
      const visible=[...root.querySelectorAll('#bcRecipients tr')].filter(r=>r.style.display!=='none'&&!r.innerText.includes('Tidak ada customer')).length;
      const label=root.querySelector('#gomaBroadcastSearchResult');
      if(label) label.textContent=q?`${visible} customer cocok`:'Cari nama atau nomor WhatsApp.';
      return;
    }
    if(scope==='customers'){
      const existing=root.querySelector('#customerSearch2');
      if(existing && existing!==input) existing.value=input.value;
      root.querySelectorAll('#custTableBody2 tr, #custTable tbody tr, tbody tr').forEach(row=>{
        const hay=(row.innerText||'').toLocaleLowerCase('id-ID');
        row.style.display=(!q||hay.includes(q))?'':'none';
      });
      return;
    }
    // Search all visible record tables in Booking, Follow Up, Finance and Reports.
    root.querySelectorAll('tbody tr').forEach(row=>{
      const hay=(row.innerText||'').toLocaleLowerCase('id-ID');
      row.style.display=(!q||hay.includes(q))?'':'none';
    });
    // Also filter non-table record cards if the page uses cards instead of a table.
    if(scope==='followups'){
      root.querySelectorAll('.followup-row,.followup-card,[data-followup]').forEach(row=>{
        const hay=(row.innerText||'').toLocaleLowerCase('id-ID');
        row.style.display=(!q||hay.includes(q))?'':'none';
      });
    }
  }

  function makeSearch(scope, placeholder){
    const root=document.getElementById('content');
    if(!root)return;
    let input=root.querySelector(`#goma-search-${scope}`);
    if(input){
      input.value=searchState[scope]||'';
      filterRows(input,scope);
      return;
    }
    input=document.createElement('input');
    input.type='search';
    input.id=`goma-search-${scope}`;
    input.className='input goma-global-search';
    input.placeholder=placeholder;
    input.setAttribute('aria-label',placeholder);
    input.autocomplete='off';
    input.value=searchState[scope]||'';
    input.addEventListener('input',()=>filterRows(input,scope));

    const card=root.querySelector('.card');
    if(!card)return;
    const tableWrap=(scope==='broadcast')?root.querySelector('.table-wrap'):null;
    if(scope==='inbox'){
      const list=root.querySelector('.inbox');
      if(list)list.insertAdjacentElement('beforebegin',input);
      else card.appendChild(input);
    } else if(scope==='broadcast'){
      const count=root.querySelector('#bcCount');
      const holder=document.createElement('div');
      holder.className='goma-search-wrap';
      holder.appendChild(input);
      const result=document.createElement('div');
      result.id='gomaBroadcastSearchResult';result.className='label goma-search-result';
      result.textContent='Cari nama atau nomor WhatsApp.';
      holder.appendChild(result);
      if(count)count.insertAdjacentElement('afterend',holder);
      else if(tableWrap)tableWrap.insertAdjacentElement('beforebegin',holder);
      else card.appendChild(holder);
    } else if(scope==='customers'){
      // The customer page already has its own search control; enhance it instead of duplicating it.
      const original=root.querySelector('#customerSearch2')||root.querySelector('input[placeholder*="Cari nama"]');
      if(original){
        original.placeholder='Cari nama, nomor WhatsApp, kota, sumber, atau penanda...';
        original.setAttribute('aria-label',original.placeholder);
        original.value=searchState.customers||'';
        original.setAttribute('oninput','applyCustomerFilters()');
        original.addEventListener('input',()=>{searchState.customers=original.value;});
        if(typeof window.applyCustomerFilters==='function') window.applyCustomerFilters();
        return;
      }
      const heading=card.querySelector('.section-title');
      if(heading)heading.insertAdjacentElement('afterend',input);else card.prepend(input);
    } else {
      const heading=card.querySelector('.section-title');
      if(heading)heading.insertAdjacentElement('afterend',input);
      else card.prepend(input);
    }
    filterRows(input,scope);
  }

  function addSearchStyles(){
    if(document.getElementById('goma-search-v4-style'))return;
    const style=document.createElement('style');style.id='goma-search-v4-style';
    style.textContent=`
      .goma-global-search{display:block;width:100%;max-width:none;margin:10px 0 12px;min-height:42px;padding:10px 14px;background:#fffdf9;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--ink)}
      .goma-global-search::placeholder{color:var(--muted);opacity:.9}
      .goma-search-wrap{margin:10px 0 12px}
      .goma-search-result{margin:4px 2px 8px;font-size:12px;color:var(--muted)}
      @media(max-width:700px){.goma-global-search{font-size:16px;min-height:44px;margin:8px 0 10px}.goma-search-wrap{margin:8px 0 10px}}
    `;
    document.head.appendChild(style);
  }

  function applyTopBookingVisibility(){
    const page=pageNow();
    const top=document.querySelector('.top-actions');
    if(!top)return;
    const bookingButton=[...top.querySelectorAll('button')].find(b=>/booking/i.test(b.textContent||''));
    if(bookingButton)bookingButton.style.display=(page==='inbox'||page==='bookings')?'':'none';
  }

  function enhancePage(){
    addSearchStyles();
    const page=pageNow();
    if(searchPages.has(page)){
      const placeholders={
        inbox:'Cari nama pelanggan atau nomor WhatsApp…',
        customers:'Cari nama, nomor WhatsApp, kota, atau penanda…',
        bookings:'Cari nama pelanggan, nomor, layanan, tanggal, admin…',
        followups:'Cari nama pelanggan, nomor WhatsApp, catatan…',
        finance:'Cari nama pelanggan, nomor, terapis, admin, tanggal…',
        reports:'Cari nama pelanggan, nomor, terapis, admin, tanggal…',
        broadcast:'Cari penerima berdasarkan nama atau nomor WhatsApp…'
      };
      makeSearch(page,placeholders[page]);
    }
    applyTopBookingVisibility();
  }

  // Wrap the active render dispatcher so navigation keeps the correct actions and search control.
  const priorRender=window.render;
  if(typeof priorRender==='function'){
    window.render=function(){
      priorRender();
      requestAnimationFrame(enhancePage);
    };
  }
  // Remove the duplicate universal date toolbar from Broadcast. The native Broadcast date range
  // remains and defaults to the current Jakarta date, not the last day of the month.
  if(typeof __renderBroadcastDateBase==='function'){
    window.render_broadcast=function(){
      __renderBroadcastDateBase();
      requestAnimationFrame(enhancePage);
    };
  } else if(typeof window.render_broadcast==='function'){
    const priorBroadcast=window.render_broadcast;
    window.render_broadcast=function(){priorBroadcast();requestAnimationFrame(enhancePage);};
  }
  // Keep Broadcast search applied when its date/status filter rebuilds recipient rows.
  if(typeof window.renderBroadcastRecipients==='function'){
    const priorRecipients=window.renderBroadcastRecipients;
    window.renderBroadcastRecipients=function(){priorRecipients();const input=document.getElementById('goma-search-broadcast');if(input)filterRows(input,'broadcast');};
  }
  // Wrap individual page renderers so searches return after filters, edits, and page refreshes.
  ['inbox','customers','bookings','followups','finance','reports'].forEach(page=>{
    const key='render_'+page,prior=window[key];
    if(typeof prior==='function'){
      window[key]=function(){prior();requestAnimationFrame(enhancePage);};
    }
  });
  // Refresh the visible controls after the initial load and hash navigation.
  document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(enhancePage));
  window.addEventListener('hashchange',()=>requestAnimationFrame(enhancePage));
  setTimeout(enhancePage,0);
})();
</script>

<script>
/* PWA: daftar service worker + tombol "Pasang Aplikasi" */
(function(){
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
  var deferred = null;
  function standalone(){
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  }
  function hideBtn(){ var b=document.getElementById("pwaInstall"); if(b) b.remove(); }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
    try { if (localStorage.getItem("goma_pwa_dismiss") === "1") return; } catch(_){}
    if (standalone() || document.getElementById("pwaInstall")) return;
    var b = document.createElement("div");
    b.id = "pwaInstall";
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:99999;background:#693601;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:600 14px system-ui,sans-serif;max-width:92vw";
    b.innerHTML = '<span>Pasang Goma CRM di layar utama?</span>' +
      '<button id="pwaYes" style="background:#f3e6d3;color:#4a2800;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer">Pasang</button>' +
      '<button id="pwaNo" aria-label="Tutup" style="background:transparent;color:#f3e6d3;border:0;font-size:20px;line-height:1;cursor:pointer">&times;</button>';
    document.body.appendChild(b);
    document.getElementById("pwaYes").onclick = function(){
      if (!deferred) return hideBtn();
      deferred.prompt();
      deferred.userChoice.finally(function(){ deferred = null; hideBtn(); });
    };
    document.getElementById("pwaNo").onclick = function(){
      try { localStorage.setItem("goma_pwa_dismiss","1"); } catch(_){}
      hideBtn();
    };
  });
  window.addEventListener("appinstalled", hideBtn);
})();
</script>
<script>
/* Notifikasi chat baru (Web Push) */
(function(){
  var supported = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
  function base(){ return (db.settings.apiBase||"").replace(/\/$/,""); }
  function u8(b64){ var p=(b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"); var r=atob(p),o=new Uint8Array(r.length); for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i); return o; }
  function hdr(){ return {"Content-Type":"application/json","X-GOMA-API-KEY":db.settings.apiKey||""}; }
  function flag(v){ try{ if(v===undefined) return localStorage.getItem("goma_push")==="1"; localStorage.setItem("goma_push",v?"1":"0"); }catch(_){ return false; } }

  window.gomaPushSupported = function(){ return supported; };
  window.gomaPushEnabled = function(){ return supported && Notification.permission==="granted" && flag(); };

  window.gomaEnablePush = async function(){
    if(!supported){
      alert("Browser ini belum mendukung notifikasi.\n\nDi iPhone: buka CRM di Safari, tekan ikon Bagikan → Tambah ke Layar Utama, lalu buka CRM dari ikon di layar utama (butuh iOS 16.4 ke atas).");
      return false;
    }
    if(!base()||!db.settings.apiKey){ alert("Isi dulu URL Worker API dan GOMA API Key di Pengaturan."); return false; }
    try{
      var haveSw = await navigator.serviceWorker.getRegistration();
      if(!haveSw){ alert("File sw.js belum terpasang di server, jadi notifikasi belum bisa diaktifkan. Upload semua file ZIP dulu."); return false; }
      var perm = await Notification.requestPermission();
      if(perm!=="granted"){ alert("Izin notifikasi ditolak. Buka pengaturan browser/HP untuk mengizinkannya, lalu coba lagi."); return false; }
      var reg = await navigator.serviceWorker.ready;
      var k = await (await fetch(base()+"/api/push/key")).json();
      if(!k.key) throw new Error("kunci tidak diterima dari server");
      var sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:u8(k.key)});
      var r = await fetch(base()+"/api/push/subscribe",{method:"POST",headers:hdr(),body:JSON.stringify({subscription:sub.toJSON(),ua:navigator.userAgent.slice(0,150)})});
      var j = await r.json();
      if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
      flag(true);
      var pill=document.getElementById("pushPill"); if(pill) pill.remove();
      if(typeof window.gomaPushRefresh==="function") window.gomaPushRefresh();
      alert("Notifikasi aktif di HP ini ✅ ("+j.devices+" perangkat terdaftar)");
      return true;
    }catch(e){ alert("Gagal mengaktifkan notifikasi: "+(e.message||e)); return false; }
  };

  window.gomaDisablePush = async function(){
    try{
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if(sub){
        try{ await fetch(base()+"/api/push/unsubscribe",{method:"POST",headers:hdr(),body:JSON.stringify({endpoint:sub.endpoint})}); }catch(_){}
        await sub.unsubscribe();
      }
    }catch(_){}
    flag(false);
    if(typeof window.gomaPushRefresh==="function") window.gomaPushRefresh();
    alert("Notifikasi dimatikan di HP ini.");
  };

  window.gomaTestPush = async function(){
    try{
      var r = await fetch(base()+"/api/push/test",{method:"POST",headers:hdr()});
      var j = await r.json();
      if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
      alert(j.total? ("Tes dikirim ke "+j.sent+" dari "+j.total+" perangkat."+(j.failed?(" Gagal: "+j.failed+"."):"")) : "Belum ada HP yang terdaftar. Tekan Aktifkan Notifikasi dulu.");
    }catch(e){ alert("Tes gagal: "+(e.message||e)); }
  };

  /* Kartu pengaturan */
  function card(){
    var on = window.gomaPushEnabled();
    var denied = supported && Notification.permission==="denied";
    var h = '<div class="card section" id="pushCard"><h2>Notifikasi Chat Baru</h2><p class="label">Bunyi dan tampil di HP setiap ada chat masuk, walau CRM sedang ditutup. Aktifkan di setiap HP yang dipakai admin.</p>';
    if(!supported) h += '<p class="label"><b>Browser ini belum mendukung notifikasi.</b> Di iPhone, pasang dulu CRM ke Layar Utama lalu buka dari ikonnya (iOS 16.4+).</p>';
    else if(denied) h += '<p class="label"><b>Izin notifikasi diblokir.</b> Buka pengaturan browser/HP → izinkan notifikasi untuk situs ini.</p>';
    else if(on) h += '<p class="label">Status: <b>aktif di HP ini ✅</b></p><button class="btn primary" onclick="gomaTestPush()">Kirim Tes Notifikasi</button> <button class="btn" onclick="gomaDisablePush()">Matikan di HP ini</button>';
    else h += '<p class="label">Status: <b>belum aktif di HP ini</b></p><button class="btn primary" onclick="gomaEnablePush()">🔔 Aktifkan Notifikasi</button>';
    h += '<hr><p class="label">Bunyi bel keras saat CRM sedang terbuka: <b>'+(window.gomaBellOn&&window.gomaBellOn()?'hidup':'mati')+'</b></p><button class="btn" onclick="gomaRing(true)">🔔 Tes Bunyi Bel</button> <button class="btn" onclick="gomaBellToggle()">'+(window.gomaBellOn&&window.gomaBellOn()?'Matikan bunyi bel':'Hidupkan bunyi bel')+'</button>';
    return h + '</div>';
  }
  window.gomaPushRefresh = function(){
    var c=document.getElementById("pushCard"); if(!c) return;
    var t=document.createElement("div"); t.innerHTML=card(); c.replaceWith(t.firstChild);
  };
  var prev = window.render_settings;
  if(typeof prev==="function"){
    window.render_settings = function(){
      var r = prev.apply(this, arguments);
      try{
        var box = document.getElementById("content");
        if(box && !document.getElementById("pushCard")){
          var t=document.createElement("div"); t.innerHTML=card(); box.appendChild(t.firstChild);
        }
      }catch(_){}
      return r;
    };
  }

  /* Ajakan sekali saja */
  window.addEventListener("load", function(){
    setTimeout(async function(){
      try{
        if(!supported || Notification.permission!=="default" || flag()) return;
        if(!(await navigator.serviceWorker.getRegistration())) return;
        if(!db.settings.apiBase || !db.settings.apiKey) return;
        if(localStorage.getItem("goma_push_ask")==="1") return;
        var b=document.createElement("div"); b.id="pushPill";
        b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:99998;background:#693601;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:600 14px system-ui,sans-serif;max-width:92vw";
        b.innerHTML='<span>🔔 Aktifkan notifikasi chat baru?</span><button id="pushYes" style="background:#f3e6d3;color:#4a2800;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer">Aktifkan</button><button id="pushNo" aria-label="Tutup" style="background:transparent;color:#f3e6d3;border:0;font-size:20px;line-height:1;cursor:pointer">&times;</button>';
        document.body.appendChild(b);
        document.getElementById("pushYes").onclick=function(){ gomaEnablePush(); };
        document.getElementById("pushNo").onclick=function(){ try{localStorage.setItem("goma_push_ask","1");}catch(_){} b.remove(); };
      }catch(_){}
    }, 4000);
  });

  /* Buka chat dari notifikasi */
  function openFromPush(id){
    var n=0, t=setInterval(function(){
      n++;
      try{
        var x=(db.inbox||[]).find(function(c){return String(c.id)===String(id)});
        if(x){ clearInterval(t); if(window.gotoChat) window.gotoChat(x.id); else openChat(x.id); }
        else if(n===2 && typeof syncWhatsAppInbox==="function") syncWhatsAppInbox(true);
      }catch(_){}
      if(n>25) clearInterval(t);
    }, 400);
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message", function(e){
      if(e.data && e.data.type==="open-chat") openFromPush(e.data.chatId);
    });
  }
  var m = /^#chat=(\d+)/.exec(location.hash||"");
  if(m){ var cid=m[1]; location.hash="inbox"; window.addEventListener("load", function(){ openFromPush(cid); }); }
